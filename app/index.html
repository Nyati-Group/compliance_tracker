<meta charset="utf-8">
<title>Compliance Tracker &amp; Calendar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout concept: fixed top app-bar + left stage/filter rail on desktop, collapsing
   to a bottom tab bar on phone; content is a single scrollable column of cards. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#eceff2; --border:#d8dee4;
  --text:#192230; --text-muted:#5b6676; --accent:#2b4a73; --accent-ink:#ffffff;
  --ok:#1c7a4d; --ok-bg:#e4f5ec; --warn:#9a6b00; --warn-bg:#fdf1d8;
  --bad:#b3261e; --bad-bg:#fbe7e5; --hold:#5b4b8a; --hold-bg:#ece7f6;
  --neutral:#5b6676; --neutral-bg:#e9ebee;
  --font-display:'Public Sans',system-ui,sans-serif; --font-body:'Public Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --side-bg:linear-gradient(180deg,#172c4d 0%,#0f1f38 100%); --side-border:rgba(255,255,255,.10); --side-text:#c5d3e8; --side-label:#7f95b6;
  --side-hover:rgba(255,255,255,.08); --side-card:rgba(255,255,255,.07); --side-title:#ffffff; --side-active:#2f6bb8; --side-active-ink:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --surface:#171d25; --surface-2:#1e2630; --border:#2b3440;
    --text:#e7ebef; --text-muted:#99a4b2; --accent:#7ca3d6; --accent-ink:#0d1117;
    --ok:#5fd394; --ok-bg:#163428; --warn:#e8b94e; --warn-bg:#3a2e0f;
    --bad:#f08b85; --bad-bg:#3a1c1a; --hold:#b7a6e6; --hold-bg:#2a2340;
    --neutral:#99a4b2; --neutral-bg:#232b35;
    --side-bg:linear-gradient(180deg,#13233c 0%,#0c1626 100%); --side-border:rgba(255,255,255,.09); --side-text:#c5d3e8; --side-label:#7f95b6;
    --side-hover:rgba(255,255,255,.08); --side-card:rgba(255,255,255,.06); --side-title:#ffffff; --side-active:#2f6bb8; --side-active-ink:#ffffff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#171d25; --surface-2:#1e2630; --border:#2b3440;
  --text:#e7ebef; --text-muted:#99a4b2; --accent:#7ca3d6; --accent-ink:#0d1117;
  --ok:#5fd394; --ok-bg:#163428; --warn:#e8b94e; --warn-bg:#3a2e0f;
  --bad:#f08b85; --bad-bg:#3a1c1a; --hold:#b7a6e6; --hold-bg:#2a2340;
  --neutral:#99a4b2; --neutral-bg:#232b35;
  --side-bg:linear-gradient(180deg,#13233c 0%,#0c1626 100%); --side-border:rgba(255,255,255,.09); --side-text:#c5d3e8; --side-label:#7f95b6;
  --side-hover:rgba(255,255,255,.08); --side-card:rgba(255,255,255,.06); --side-title:#ffffff; --side-active:#2f6bb8; --side-active-ink:#ffffff;
  color-scheme:dark;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;height:100%;}
body{
  font-family:var(--font-body); background:var(--bg); color:var(--text);
  padding-left:max(0px, env(safe-area-inset-left,0px)); padding-right:max(0px, env(safe-area-inset-right,0px));
  font-size:14px; line-height:1.45;
}
a{color:var(--accent);}
h1,h2,h3,h4{font-family:var(--font-display); text-wrap:balance; margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:13px;}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}

/* ---------- App shell ---------- */
#app{display:flex; min-height:100vh;}
.sidebar{
  position:sticky; top:0; align-self:flex-start; height:100vh; width:236px; flex-shrink:0; z-index:30;
  background:var(--side-bg); border-right:1px solid var(--side-border);
  padding:0 12px 14px; display:flex; flex-direction:column; gap:6px; overflow-y:auto; scrollbar-width:none;
}
.sidebar::-webkit-scrollbar{display:none; width:0; height:0;}
.brand{display:flex; align-items:center; gap:11px; font-weight:700; font-size:15px; line-height:1.25; color:var(--side-title); padding:18px 6px 16px; margin:0 -2px 6px; border-bottom:1px solid var(--side-border);}
.brand .logo{height:42px; width:auto; display:block; object-fit:contain; flex-shrink:0; background:#fff; border-radius:10px; padding:5px 7px;}
.tabs{display:flex; flex-direction:column; gap:2px; flex:1;}
.nav-label{font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--side-label); padding:14px 12px 5px;}
.tabs .nav-label:first-child{padding-top:4px;}
.tab{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; border:1px solid transparent; background:transparent;
  color:var(--side-text); font-size:13.5px; font-weight:600; text-align:left; width:100%; transition:background .12s, color .12s;
}
.tab .nav-ic{width:19px; height:19px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; opacity:.85;}
.tab.active{background:var(--side-active); color:var(--side-active-ink); box-shadow:0 4px 12px rgba(0,0,0,.28);}
.tab.active .nav-ic{opacity:1;}
.tab:not(.active):hover{background:var(--side-hover); color:#fff;}
.tab:focus-visible{outline:2px solid #8fb8ee; outline-offset:2px;}
.side-user{display:flex; align-items:center; gap:10px; padding:10px 12px; margin-top:8px; border-radius:12px; background:var(--side-card); border:1px solid var(--side-border);}
.side-avatar{width:34px; height:34px; border-radius:50%; background:var(--side-active); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;}
.side-user .nm{font-size:13px; font-weight:700; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.side-user .rl{font-size:11.5px; color:var(--side-label); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.side-user>div{min-width:0;}
.content{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--border);
  padding:10px 16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;
}
.topbar-right{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
select.pill, .pill-btn, .pill{
  padding:6px 10px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); font-size:12.5px;
}
main{flex:1; padding:18px 16px 40px; max-width:1280px; margin:0 auto; width:100%;}
@media (max-width:760px){
  #app{flex-direction:column;}
  .sidebar{position:static; height:auto; width:100%; border-right:none; border-bottom:1px solid var(--side-border); padding:0 12px 10px; gap:6px;}
  .brand{padding:12px 6px; margin:0 0 4px;}
  .tabs{flex-direction:row; flex-wrap:wrap; gap:4px;}
  .tab{width:auto; padding:8px 12px;}
  .nav-label, .side-user{display:none !important;}
  .topbar{position:static; justify-content:flex-start;}
}

.view{display:none;}
.view.active{display:block;}

/* ---------- generic components ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px;}
.grid{display:grid; gap:14px;}
.grid-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:4px;}
.stat-tile .num{font-family:var(--font-mono); font-size:26px; font-weight:700;}
.stat-tile .label{color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em;}
.section-title{font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin:26px 0 10px;}
.section-title:first-child{margin-top:0;}

.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap;}
.badge.ok{background:var(--ok-bg); color:var(--ok);}
.badge.warn{background:var(--warn-bg); color:var(--warn);}
.badge.bad{background:var(--bad-bg); color:var(--bad);}
.badge.hold{background:var(--hold-bg); color:var(--hold);}
.badge.neutral{background:var(--neutral-bg); color:var(--neutral);}
.badge .ic{font-size:10px;}

.proposed-flag{display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:6px; background:var(--warn-bg); color:var(--warn); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}

/* ---------- Dashboard ---------- */
.dash-cols{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
@media (max-width:760px){.dash-cols{grid-template-columns:1fr;}}
.bar-row{display:flex; align-items:center; gap:10px; margin:8px 0;}
.bar-row .lbl{width:120px; font-size:12px; color:var(--text-muted); flex-shrink:0;}
.bar-track{flex:1; height:9px; border-radius:5px; background:var(--surface-2); overflow:hidden; display:flex;}
.bar-seg{height:100%;}
.bar-row .pct{width:42px; text-align:right; font-family:var(--font-mono); font-size:12px; color:var(--text-muted);}
table.simple{width:100%; border-collapse:collapse; font-size:12.5px;}
table.simple th{text-align:left; color:var(--text-muted); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--border); font-size:11px; text-transform:uppercase; letter-spacing:.03em;}
table.simple td{padding:7px 8px; border-bottom:1px solid var(--border);}
table.simple tr:last-child td{border-bottom:none;}

/* ---------- Stage view ---------- */
.stage-block{border:1px solid var(--border); border-radius:12px; margin-bottom:14px; background:var(--surface); overflow:hidden;}
.stage-head{display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; background:var(--surface);}
.stage-head:hover{background:var(--surface-2);}
.stage-head h3{font-size:15px; flex:1; min-width:0;}
.stage-chevron{transition:transform .15s; color:var(--text-muted);}
.stage-block.open .stage-chevron{transform:rotate(90deg);}
.stage-progress{width:120px; flex-shrink:0;}
.stage-count{font-family:var(--font-mono); font-size:12px; color:var(--text-muted); white-space:nowrap;}
.stage-items{display:none; border-top:1px solid var(--border);}
.stage-block.open .stage-items{display:block;}
.seg{display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; flex-shrink:0;}
.seg-btn{padding:6px 13px; background:var(--surface); border:none; border-right:1px solid var(--border); color:var(--text-muted); font-size:12.5px; font-weight:600;}
.seg-btn:last-child{border-right:none;}
.seg-btn:hover:not(:disabled){background:var(--surface-2); color:var(--text);}
.seg-btn.on.yes{background:var(--ok-bg); color:var(--ok);} .seg-btn.on.no{background:var(--bad-bg); color:var(--bad);} .seg-btn.on.unk{background:var(--surface-2); color:var(--text);}
.q.ro .seg-btn{cursor:default;}
.q{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.q:last-child{border-bottom:none;}
.q-text{flex:1 1 280px; font-size:13px; line-height:1.4;}
.q-sub{font-size:11.5px; color:var(--text-muted); margin-top:2px;}
.q-group{margin-bottom:14px;}
.q-group h5{margin:0 0 2px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-family:var(--font-display);}
.step{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px;}
.step-head{display:flex; gap:10px; align-items:center; margin-bottom:4px;}
.step-head h4{margin:0; font-size:14px; font-family:var(--font-display);}
.step-num{width:24px; height:24px; border-radius:50%; background:var(--surface-2); color:var(--text-muted); display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;}
.step-num.done{background:var(--ok-bg); color:var(--ok);}
.step-desc{font-size:12.5px; color:var(--text-muted); margin:0 0 12px 34px; line-height:1.5;}
.step-body{margin-left:34px;}
@media (max-width:640px){.step-desc,.step-body{margin-left:0;}}
.setup-progress{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 18px;}
.modal-foot{position:sticky; bottom:0; display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:12px 22px; background:var(--surface); border-top:1px solid var(--border);}
.clickable{cursor:pointer;} .clickable:hover{background:var(--surface-2);}
.proj-table td{vertical-align:middle; padding:9px 12px;} .proj-table th{padding:8px 12px;}
.nowrap{white-space:nowrap;}
.flag-chips{display:flex; gap:4px; flex-wrap:wrap; margin-top:2px;}
.fold{background:var(--surface); border:1px solid var(--border); border-radius:12px;}
.fold>summary{cursor:pointer; padding:13px 16px; font-weight:600; font-size:13px; list-style:none; display:flex; align-items:center; gap:8px;}
.fold>summary::-webkit-details-marker{display:none;}
.fold>summary>span:first-child{flex:1;}
.fold>summary::after{content:'▾'; color:var(--text-muted); font-size:12px;}
.fold[open]>summary::after{content:'▴';}
.fold-body{padding:0 16px 14px;}
.fold .panel{border:none; padding:0; background:none; border-radius:0;}
.fold .panel>h4{display:none;}
.modal-stack{gap:14px;}
.modal-stack .prose{font-size:14.5px; line-height:1.65;}
.who{display:flex; gap:28px; flex-wrap:wrap;}
.who>div{display:flex; flex-direction:column; gap:2px;}
.who-label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:600;}
.who-name{font-size:14.5px; font-weight:600;}
.fold.more{background:var(--surface-2);}
.fold.more>summary{justify-content:center; text-align:center; font-size:13.5px; padding:14px 16px;}
.fold.more>summary>span:first-child{flex:0 0 auto;}
.fold.more[open]{background:var(--surface);}
.glance{margin:0; display:grid; gap:11px;}
.glance>div{display:grid; grid-template-columns:118px minmax(0,1fr); gap:12px; font-size:13px; line-height:1.45;}
.glance dt{color:var(--text-muted); font-size:12px; padding-top:1px;}
.glance dd{margin:0; font-weight:500; overflow-wrap:anywhere;}
.banner{border-radius:10px; padding:11px 14px; font-size:13px; line-height:1.45; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--border);}
.banner.hold{border-left-color:var(--hold); background:var(--hold-bg);} .banner.ok{border-left-color:var(--ok); background:var(--ok-bg);}
.banner.bad{border-left-color:var(--bad); background:var(--bad-bg);} .banner.muted{background:var(--surface-2);}
@media (max-width:520px){.glance>div{grid-template-columns:1fr; gap:2px;}}
.bell{position:relative;}
.bell .dot{position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; border-radius:9px; background:var(--bad); color:#fff; font-size:10.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; padding:0 4px;}
.note-panel{position:fixed; top:54px; right:16px; width:min(400px, calc(100vw - 32px)); max-height:72vh; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:0 16px 48px rgba(0,0,0,.28); z-index:45;}
.note-head{display:flex; align-items:center; justify-content:space-between; padding:11px 14px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface);}
.note{display:flex; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer; font-size:12.5px;}
.note:hover{background:var(--surface-2);}
.note.unread{background:var(--surface-2);}
.note .lvl{width:8px; height:8px; border-radius:50%; margin-top:5px; flex-shrink:0; background:var(--neutral);}
.note .lvl.warn{background:var(--warn);} .note .lvl.bad{background:var(--bad);} .note .lvl.info{background:var(--accent);}
.note .t{font-weight:700;} .note .m{color:var(--text-muted); margin-top:1px;} .note .w{color:var(--text-muted); font-size:11px; margin-top:2px;}
.risk-edit{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:6px;} .risk-edit select{padding:5px 8px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:12.5px;}
.doc-vgroup{border-bottom:1px solid var(--border); padding:8px 0;} .doc-vgroup:last-child{border-bottom:none;}
.doc-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
.setup-card{margin-bottom:10px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
.setup-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
@media (max-width:640px){.setup-grid{grid-template-columns:1fr;}}
.setup-row{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
.setup-row:last-child{border-bottom:none;}
.setup-add{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
.setup-add input,.setup-add select{flex:1 1 120px; min-width:0; padding:6px 8px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text);}
.stage-title{flex:1; min-width:0;}
.stage-desc{font-size:12px; color:var(--text-muted); margin-top:2px; font-weight:400;}
.stage-intro{padding:14px 16px 4px;}
.stage-intro .stage-desc{font-size:13px; margin:0 0 10px;}
.stage-intro .stage-chips{margin-top:0; margin-bottom:10px;}
.stage-head{align-items:center;}
.stage-chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:7px;}
.chip{display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--text-muted); font-weight:600;}
.chip.ok{background:var(--ok-bg); color:var(--ok);} .chip.warn{background:var(--warn-bg); color:var(--warn);} .chip.bad{background:var(--bad-bg); color:var(--bad);} .chip.hold{background:var(--hold-bg); color:var(--hold);}
.stage-note{padding:12px 16px; font-size:12.5px; color:var(--text-muted);}
.filters{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px;}
.filters label{display:flex; flex-direction:column; gap:3px; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); font-weight:600;}
.filters select{padding:6px 8px; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:12.5px; min-width:130px; max-width:200px;}
.item-row{display:grid; grid-template-columns:86px minmax(0,1fr) 150px 108px 200px; gap:14px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); font-size:13px;}
.item-row .d1{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.4;}
.item-row .d2{color:var(--text-muted); font-size:11.5px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.item-row .stcell{display:flex; flex-direction:column; align-items:flex-start; gap:4px;}
.item-row .stcell .badge{white-space:nowrap;}
.item-row .ownercell{overflow-wrap:anywhere; color:var(--text-muted);}
.item-row:last-child{border-bottom:none;}
.item-row:hover{background:var(--surface-2); cursor:pointer;}
.item-row .idcell{font-family:var(--font-mono); font-weight:700; font-size:12px;}
.item-row .desc{min-width:0;}
.item-row .muted{color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
@media (max-width:860px){
  .item-row{grid-template-columns:1fr; gap:4px;}
  .item-row>div::before{content:attr(data-lbl); display:block; font-size:10px; color:var(--text-muted); text-transform:uppercase;}
}
.item-row-header{display:grid; grid-template-columns:86px minmax(0,1fr) 150px 108px 200px; gap:14px; padding:8px 16px; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); background:var(--surface-2); border-top:1px solid var(--border);}
@media (max-width:860px){.item-row-header{display:none;}}

/* ---------- Calendar ---------- */
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:10px; overflow:hidden;}
.cal-dow{background:var(--surface-2); text-align:center; font-size:11px; padding:6px 0; color:var(--text-muted); text-transform:uppercase;}
.cal-cell{background:var(--surface); min-height:90px; padding:6px; font-size:11px; display:flex; flex-direction:column; gap:3px;}
.cal-cell.off{background:var(--surface-2); color:var(--text-muted);}
.cal-cell .dnum{font-family:var(--font-mono); font-size:11px; color:var(--text-muted);}
.cal-cell.today .dnum{color:var(--accent); font-weight:800;}
.cal-chip{border-radius:5px; padding:2px 5px; font-size:10.5px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cal-more{font-size:10px; color:var(--text-muted);}
.undated-panel{margin-top:16px;}
.und-head{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; margin-bottom:12px;}
.und-search{min-width:280px; flex:0 1 360px;}
.und-count{font-size:12px; color:var(--text-muted); margin-bottom:6px;}
.und-table{width:100%; border-collapse:collapse; font-size:13px;}
.und-table th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); padding:8px 10px; border-bottom:1px solid var(--border);}
.und-table td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
.und-table tbody tr{cursor:pointer;} .und-table tbody tr:hover{background:var(--surface-2);}
.und-desc{max-width:520px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.undated-chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:8px; padding:6px 10px; margin:3px; font-size:12px; cursor:pointer; background:var(--surface);}

/* ---------- Register table ---------- */
.register-toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
.register-toolbar input[type=text]{flex:1; min-width:180px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text);}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:10px;}
table.register{width:100%; border-collapse:collapse; font-size:12px; min-width:900px;}
table.register th{position:sticky; top:0; background:var(--surface-2); text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; font-size:10.5px; text-transform:uppercase; color:var(--text-muted);}
table.register td{padding:7px 10px; border-bottom:1px solid var(--border); max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
table.register tr:hover td{background:var(--surface-2); cursor:pointer;}
.col-chooser{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
.col-chooser label{font-size:11.5px; display:flex; gap:4px; align-items:center; background:var(--surface-2); border-radius:6px; padding:3px 8px;}

/* ---------- Data quality ---------- */
.dq-group{margin-bottom:18px;}
.dq-group h3{font-size:14px; margin-bottom:8px;}
.dq-list{display:flex; flex-direction:column; gap:1px; border:1px solid var(--border); border-radius:10px; overflow:hidden;}
.dq-item{display:flex; justify-content:space-between; gap:10px; padding:8px 12px; background:var(--surface); font-size:12.5px; cursor:pointer;}
.dq-item:hover{background:var(--surface-2);}

/* ---------- Drawer ---------- */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; display:none;}
.overlay.show{display:block;}
.drawer{
  position:fixed; top:50%; left:50%; width:min(820px,94vw); max-height:90vh; background:var(--surface); z-index:41;
  transform:translate(-50%,-48%) scale(.98); opacity:0; visibility:hidden; transition:opacity .15s ease, transform .15s ease, visibility .15s;
  overflow-y:auto; border:1px solid var(--border); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.35);
  padding:0;
}
.modal-head{position:sticky; top:0; z-index:2; display:flex; gap:12px; align-items:flex-start; padding:18px 22px 14px; background:var(--surface); border-bottom:1px solid var(--border);}
.modal-head .drawer-close{position:static; flex-shrink:0;}
.modal-badges{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:8px;}
.modal-id{font-weight:700; font-size:13px; background:var(--accent); color:var(--accent-ink); padding:3px 9px; border-radius:6px;}
.modal-title{font-size:16px; line-height:1.4; font-weight:600; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
.modal-body{padding:18px 22px 26px; background:var(--bg); display:flex; flex-direction:column; gap:14px;}
.modal-grid{display:grid; grid-template-columns:1.25fr 1fr; gap:14px; align-items:start;}
@media (max-width:760px){.modal-grid{grid-template-columns:1fr;}}
.modal-col{display:flex; flex-direction:column; gap:14px; min-width:0;}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px;}
.panel>h4{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin:0 0 10px; font-family:var(--font-display);}
.prose{font-size:13.5px; line-height:1.6; white-space:pre-wrap;}
.prose-meta{margin-top:12px; padding-top:10px; border-top:1px dashed var(--border); font-size:12.5px; color:var(--text-muted);}
.prose-meta b{color:var(--text);}
.facts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media (max-width:520px){.facts{grid-template-columns:1fr;}}
.fact{background:var(--surface-2); border-radius:9px; padding:9px 11px; min-width:0;}
.fact-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin-bottom:3px; font-weight:600;}
.fact-val{font-size:13px; font-weight:600; overflow-wrap:anywhere;}
.fact-val select{font-weight:500; font-size:12px; padding:5px 6px; width:100%; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text);}
.fact-sub{font-size:11px; color:var(--text-muted); margin-top:2px; overflow-wrap:anywhere;}
.drawer.show{transform:translate(-50%,-50%) scale(1); opacity:1; visibility:visible;}
.drawer-close{position:absolute; top:14px; right:14px; background:var(--surface-2); border:none; border-radius:8px; width:30px; height:30px; font-size:16px; color:var(--text);}
.detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 22px;}
.detail-grid .wide{grid-column:1 / -1;}
@media (max-width:640px){.detail-grid{grid-template-columns:1fr;}}
.doc-check{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:5px 0; border-bottom:1px solid var(--border);}
.doc-check:last-child{border-bottom:none;}
.doc-check .st{width:18px; text-align:center; font-weight:700;}
.doc-check.done .st{color:var(--ok);}

.doc-upload{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px;}
.doc-upload select{flex:2 1 220px; width:auto;}
.doc-upload input[type=file]{flex:2 1 200px; width:auto;}
.doc-file{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
.doc-file:last-child{border-bottom:none;}
.doc-file .meta{color:var(--text-muted); font-size:11.5px;}
.btn.sm{padding:4px 10px; font-size:11.5px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-muted); margin-bottom:4px;}
.field .val{font-size:13px; white-space:pre-wrap;}
.field textarea, .field input, .field select{width:100%; padding:7px 9px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text);}
.drawer-section{border-top:1px solid var(--border); margin-top:16px; padding-top:14px;}
.btn{padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-weight:600; font-size:12.5px;}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.audit-entry{font-size:11.5px; padding:6px 0; border-bottom:1px solid var(--border); color:var(--text-muted);}
.audit-entry:last-child{border-bottom:none;}
.audit-entry b{color:var(--text);}

/* ---------- Ask AI chatbot ---------- */
.ai-fab{position:fixed; bottom:24px; right:24px; z-index:9999; display:inline-flex; align-items:center; gap:8px; padding:12px 18px; border-radius:999px; border:none; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:14px; box-shadow:0 6px 20px rgba(0,0,0,.28);}

.md-table{overflow-x:auto; margin:0 0 8px;}
.md-table table{border-collapse:collapse; font-size:12px; width:100%;}
.md-table th,.md-table td{border:1px solid var(--border); padding:4px 7px; text-align:left; vertical-align:top;}
.md-table th{background:var(--surface-2);}

.ai-actions{display:flex; gap:6px; margin-top:7px;}
.ai-actions button{background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); border-radius:6px; padding:2px 8px; font-size:11px;}
.ai-actions button:hover,.ai-actions button.on{color:var(--text); border-color:var(--accent);}
.ai-typing{display:inline-flex; gap:4px; padding:4px 0;}

.ai-typing i:nth-child(2){animation-delay:.15s;} .ai-typing i:nth-child(3){animation-delay:.3s;}
@keyframes aiDot{0%,80%,100%{opacity:.25; transform:translateY(0);}40%{opacity:1; transform:translateY(-3px);}}
.ai-chips{display:flex; flex-direction:column; gap:7px; margin-top:4px;}
.ai-chips button{text-align:left; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:8px 11px; font-size:12.5px;}
.ai-chips button:hover{border-color:var(--accent); background:var(--surface-2);}
.ai-welcome{font-size:13px; color:var(--text-muted);}
.ai-form{display:flex; gap:8px; padding:10px 12px 4px; background:var(--surface); border-top:1px solid var(--border); align-items:flex-end;}
.ai-form textarea{flex:1; resize:none; max-height:110px; padding:8px 10px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13px; line-height:1.4;}
.ai-form .btn{height:36px;}
.ai-note{padding:4px 12px 9px; font-size:10.5px; color:var(--text-muted); background:var(--surface);}
@media (prefers-reduced-motion: reduce){.ai-typing i{animation:none; opacity:.6;}}

.empty-state{text-align:center; padding:50px 20px; color:var(--text-muted);}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:9px 16px; border-radius:8px; font-size:12.5px; z-index:60; opacity:0; transition:opacity .2s;}
.toast.show{opacity:1;}
.readonly-note{font-size:11.5px; color:var(--text-muted); background:var(--surface-2); border-radius:8px; padding:8px 10px; margin-bottom:10px;}
.legend{display:flex; gap:10px; flex-wrap:wrap; font-size:11.5px; color:var(--text-muted); margin:10px 0;}
.legend span{display:inline-flex; align-items:center; gap:4px;}
.legend i{width:9px;height:9px;border-radius:50%; display:inline-block;}
/* ---------- project intelligence ---------- */
.intel-top{display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
.intel-sel{display:flex; flex-direction:column; gap:3px; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); font-weight:600;}
.intel-sel select{padding:9px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:14px; font-weight:600; min-width:300px; max-width:100%; text-transform:none; letter-spacing:0;}
.intel-card{margin-bottom:14px;}
.pi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px 18px;}
.pi-l{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); font-weight:600; margin-bottom:2px;}
.pi-v{font-size:13.5px; font-weight:600; overflow-wrap:anywhere;}
.health-main{display:flex; gap:22px; align-items:center; flex-wrap:wrap;}
.gauge-btn{background:none; border:none; padding:0; cursor:pointer; border-radius:50%;}
.gauge{width:150px; height:150px; display:block;}
.g-num{font-size:34px; font-weight:800; fill:var(--text); font-family:var(--font-display);}
.g-sub{font-size:10.5px; fill:var(--text-muted);}
.health-txt{flex:1; min-width:240px;}
.h-cat{font-size:24px; font-weight:800; font-family:var(--font-display);}
.h-tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-top:14px;}
.h-tile{background:var(--surface-2); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:2px;}
.h-tile b{font-size:22px; font-family:var(--font-mono);} .h-tile span{font-size:11.5px; color:var(--text-muted);}
.h-dead{margin-top:12px; font-size:12.5px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.ai-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
.ai-head h3{font-size:15px;}
.ai-meta{display:flex; gap:6px 18px; flex-wrap:wrap; font-size:12px; color:var(--text-muted); margin:8px 0 6px;} .ai-meta b{color:var(--text);}
.ai-sec{margin-top:12px;} .ai-sec p{margin:3px 0 0; font-size:14px; line-height:1.6;} .ai-sec ul{margin:4px 0 0 18px; padding:0; font-size:13.5px; line-height:1.55;}
.ai-l{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:700;}
.intel-actions{display:flex; justify-content:flex-end; margin:-4px 0 14px;}
.intel-fold{margin-bottom:12px;}
.tabs-row{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:12px;}
.tabs-row input[type=date]{padding:5px 8px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:12px;}
.tabbtn{padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); font-size:12.5px; font-weight:600;}
.tabbtn b{margin-left:4px; font-family:var(--font-mono);} .tabbtn.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.risk-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:12px;}
.risk-card{border:1px solid var(--border); border-left:4px solid var(--neutral); border-radius:10px; padding:12px 14px; background:var(--surface); cursor:pointer;}
.risk-card:hover{background:var(--surface-2);} .risk-card.critical{border-left-color:var(--bad);} .risk-card.high{border-left-color:var(--warn);} .risk-card.medium{border-left-color:var(--hold);}
.rc-top{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:6px;} .rc-id{font-weight:700; font-size:12px;}
.rc-title{font-size:13.5px; font-weight:600; line-height:1.35;} .rc-reason{font-size:12.5px; color:var(--text-muted); margin:3px 0 6px; line-height:1.45;}
.rc-meta{display:flex; gap:4px 14px; flex-wrap:wrap; font-size:11.5px; color:var(--text-muted);}
.rc-act{font-size:12.5px; margin-top:7px; line-height:1.45;} .rc-ev{margin-top:6px; font-size:12px;} .rc-ev summary{cursor:pointer; color:var(--text-muted);} .rc-ev ul{margin:4px 0 0 16px; padding:0;}
.stage-flow{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:8px;} @media (max-width:640px){.stage-flow{grid-template-columns:1fr;}}
.stg-table tr.cur td{background:var(--surface-2);} .stg-table td{vertical-align:middle;}
.rec-list{display:flex; flex-direction:column; gap:10px;}
.rec-row{border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:var(--surface);} .rec-row.open{background:var(--surface-2);}
.rec-main{display:grid; grid-template-columns:130px minmax(0,1fr) 110px; gap:14px; align-items:start;} @media (max-width:760px){.rec-main{grid-template-columns:1fr;}}
.rec-title{font-size:14px; font-weight:600; line-height:1.35;} .rec-sub{font-size:12.5px; color:var(--text-muted); margin-top:2px; line-height:1.45;}
.rec-meta{display:flex; gap:4px 14px; flex-wrap:wrap; font-size:11.5px; color:var(--text-muted); margin-top:5px;}
.rec-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
.rec-detail{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);}
.chart-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px;}
.chart-card{border:1px solid var(--border); border-radius:10px; padding:10px 12px;} .ch-t{font-size:12.5px; font-weight:600; margin-bottom:4px;} .chart{width:100%; height:auto; display:block;}

.report-preview{background:#fff; color:#192230; border-radius:10px; padding:18px 22px; max-height:60vh; overflow:auto;} .report-preview table{border-collapse:collapse; width:100%;} .report-preview th,.report-preview td{border:1px solid #ccd3da; padding:4px 7px; text-align:left; vertical-align:top;} .report-preview th{background:#eceff2;} .report-preview h2{font-size:14px; margin:18px 0 6px; border-bottom:1px solid #ccd3da;} .report-preview .sub,.report-preview .foot{color:#5b6676;}

.ru-card{border:1px solid var(--border); border-left:4px solid var(--neutral); border-radius:10px; padding:12px 14px; background:var(--surface); cursor:pointer;}

<script>
/* ============================= STATE ============================= */
const S = {
  items: [], stages: [], itemById: {}, cat: null, profiles: null,
  tracking: {},        // instance key (COMPLIANCE-ID__scope id) -> doc data
  audit: {},           // compliance_id (or key) -> [entries]
  companies: {},       // id -> {name, employee_count, facts}
  projects: {},        // id -> {name, company_id, rera_no, location, project_type, facts, ...}
  phases: {},          // id -> {project_id, name, rera_no}
  buildings: {},       // id -> {project_id, phase_id, name, facts}
  applic: {},          // instance key -> applicability decision
  stageOverrides: {},  // compliance_id -> stage_id
  ctx: {companyId:null, projectId:null},   // what the app is showing: one company's own records, or one project
  inst: [], instByKey: {},                 // compliance instances for the current view (rebuilt on every render)
  docsByKey: {},       // instance key -> uploaded document rows (all versions)
  deps: {edges: []},   // proposed prerequisites between records (dependencies.json)
  notes: [], roles: [], settingsMap: {}, capLabels: {},
  role: 'readonly',   // set from the signed-in user at boot; the server enforces it too
  view: 'dashboard',
  calMonth: new Date(),
  registerCols: ['compliance_id','department','compliance_level','scope','brief_description','authority_norm','frequency_norm','owner','status','applicability'],
};
let db=null;

const STATUS_DEFS = {
  'Not Started':   {cls:'neutral', ic:'○'},
  'In Progress':   {cls:'warn', ic:'◐'},
  'Submitted / Under Review': {cls:'hold', ic:'◑'},
  'Compliant / Completed': {cls:'ok', ic:'✓'},
  'Overdue':       {cls:'bad', ic:'!'},
  'Not Applicable':{cls:'neutral', ic:'—'},
  'On Hold':       {cls:'hold', ic:'❙❙'},
};
const STATUS_LIST = Object.keys(STATUS_DEFS);

let toastTimer = null;
function toast(msg, ms){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), ms||Math.min(9000, Math.max(2400, msg.length*45)));
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function daysUntil(iso){ if(!iso) return null; const d=new Date(iso+'T00:00:00'); const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }

/* ============================= DATA LOAD ============================= */
async function loadData(){
  const [itemsRes, stagesRes, catRes, profRes, depRes] = await Promise.all([fetch('items.json'), fetch('stages.json'), fetch('applicability.json'), fetch('profiles.json'), fetch('dependencies.json')]);
  S.items = await itemsRes.json();
  S.stages = await stagesRes.json();
  S.cat = await catRes.json();
  S.profiles = await profRes.json();
  S.deps = await depRes.json();
  S.coverage = await fetch('coverage-gaps.json').then(r=>r.ok ? r.json() : null).catch(()=>null);
  S.riskProposals = await fetch('risk-proposals.json').then(r=>r.ok ? r.json() : {proposals:{}}).catch(()=>({proposals:{}}));
  S.itemById = Object.fromEntries(S.items.map(i=>[i.compliance_id, i]));
}

/* ---------- compliance instances ----------
   A master record becomes one or more "instances": one per company, project, phase or building it must be tracked against
   (see core.js). Status, documents and audit all hang off the instance key. */
function blankTracking(item){
  return {status:'Not Started', status_date:null, last_updated_by:null, remarks:'', evidence_link:'', next_due_date: item.due_date_parse_value && item.due_date_parse_type==='fixed_date' ? item.due_date_parse_value : null};
}
function getTrackingKey(key, item){ return S.tracking[key] || blankTracking(item); }
function statusFromTracking(tr){
  let status = tr.status || 'Not Started';
  if(status !== 'Compliant / Completed' && status !== 'Not Applicable' && status !== 'On Hold' && tr.next_due_date){
    const d = daysUntil(tr.next_due_date);
    if(d !== null && d < 0) status = 'Overdue';
  }
  return status;
}
function worldData(){ return {items:S.items, itemById:S.itemById, profiles:S.profiles, companies:S.companies, projects:S.projects, phases:S.phases, buildings:S.buildings}; }
function decorateInst(inst){
  const dec = S.applic[inst.key] || null;
  inst.decision = dec;
  inst.appStatus = dec ? dec.status : 'Pending Review';
  inst.state = Core.stateOf(inst.appStatus);          // 'active' | 'review' | 'na'
  inst.tr = getTrackingKey(inst.key, inst.item);
  inst.status = inst.state==='na' ? 'Not Applicable' : statusFromTracking(inst.tr);
  return inst;
}
/** Document health of one record: its current versions that are waiting, rejected or expired. */
function docFlags(inst){
  const out = {pending:0, rejected:0, expired:0, expiring:0};
  const today = todayISO();
  for(const d of Core.currentDocs(S.docsByKey[inst.key]||[]).values()){
    if(d.status==='Rejected') out.rejected++;
    else if(d.expiry_date && d.expiry_date < today) out.expired++;
    else if(d.status!=='Verified') out.pending++;
    if(d.expiry_date && d.expiry_date >= today && Core.daysBetween(today, d.expiry_date) <= 30) out.expiring++;
  }
  return out;
}
function rebuildInstances(){
  if(!S.cat){ S.inst = []; S.instByKey = {}; return; }
  S.inst = Core.enumerate(worldData(), S.ctx).map(decorateInst);
  S.instByKey = Object.fromEntries(S.inst.map(i=>[i.key, i]));
  // prerequisites: which records wait on unfinished ones, which are ready to start
  const b = Core.computeBlocks(S.inst, S.deps, {state:i=>i.state, status:i=>i.status});
  S.inst.forEach(i=>{
    i.blockedBy = b.blockedBy[i.key] || [];
    i.blocked = i.blockedBy.length>0 && i.status!=='Compliant / Completed' && i.state==='active';
    i.ready = b.readyToStart.has(i.key) && i.status==='Not Started';
    i.docs = docFlags(i);
  });
}
function ctxName(){
  if(S.ctx.projectId) return (S.projects[S.ctx.projectId]||{}).name || S.ctx.projectId;
  if(S.ctx.companyId) return 'Company-wide · ' + ((S.companies[S.ctx.companyId]||{}).name || S.ctx.companyId);
  return 'Nothing selected';
}
const itemStatus = inst=>inst.status;
function effectiveStageId(item){
  return S.stageOverrides[item.compliance_id] || item.stage_id;
}

/* ============================= API DB ============================= */
// Talks to server/server.js (which stores data in MongoDB). Polls so other users' changes appear.
let ME = null;   // {email, name, role} of the signed-in user

async function api(method, url, body){
  const r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body: method==='GET' ? undefined : JSON.stringify(body||{})});
  if(r.status===401){ location.href = '/login.html'; throw new Error('not signed in'); }
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ const e = new Error(j.error || ('HTTP '+r.status)); e.status = r.status; e.body = j; throw e; }
  return j;
}

function makeApiDb(){
  const subs = [];
  const notify = ()=>subs.slice().forEach(fn=>fn());
  setInterval(notify, 5000);

  function query(name, params){
    const mk = p=>query(name, Object.assign({}, params, p));
    return {
      where(f, op, v){ return mk({key:v}); },
      orderBy(f, dir){ return mk({orderBy:f, dir:dir||'asc'}); },
      limit(n){ return mk({limit:n}); },
      onSnapshot(cb, errCb){
        let alive = true, last = null;
        const run = ()=>api('GET', '/api/'+name+'?'+new URLSearchParams(params))
          .then(rows=>{
            // Only notify on real changes: each callback re-renders the page, which would wipe half-typed forms.
            const sig = JSON.stringify(rows);
            if(!alive || sig === last) return;
            last = sig;
            cb({docs: rows.map(r=>({id:r.id, data:()=>r.data}))});
          })
          .catch(e=>{ if(alive && errCb) errCb(e); });
        subs.push(run); run();
        return ()=>{ alive=false; const i=subs.indexOf(run); if(i>=0) subs.splice(i,1); };
      }
    };
  }
  return {
    collection(name){
      const q = query(name, {});
      q.add = async data=>{ await api('POST', '/api/'+name, data); notify(); };
      return q;
    },
    doc(path){
      const [name, ...rest] = path.split('/');
      return { async set(data){ await api('PUT', '/api/'+name+'/'+encodeURIComponent(rest.join('/')), data); notify(); } };
    }
  };
}

function download(filename, text, mime){
  const url = URL.createObjectURL(new Blob([text], {type: mime}));
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ============================= DB WIRING ============================= */
async function initCapabilities(){
  db = makeApiDb();

  // Subscribe to shared collections.
  db.collection('tracking').onSnapshot(snap=>{
    snap.docs.forEach(d=>{ S.tracking[d.id] = d.data(); });
    render();
  }, e=>console.warn('tracking sub error', e));

  const mapSub = (name, assign, after)=>db.collection(name).onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>{ m[d.id]=d.data(); }); assign(m); if(after) after(); render();
  }, e=>console.warn(name+' sub error', e));
  mapSub('projects', m=>{ S.projects = m; }, ensureCtx);
  mapSub('companies', m=>{ S.companies = m; }, ensureCtx);
  mapSub('phases', m=>{ S.phases = m; });
  mapSub('buildings', m=>{ S.buildings = m; });
  mapSub('applicability', m=>{ S.applic = m; });
  mapSub('settings', m=>{ S.settingsMap = m; });
  mapSub('risk_overrides', m=>{ S.risk = m; });
  db.collection('documents').onSnapshot(snap=>{
    const m = {};
    snap.docs.forEach(d=>{ const row = {id:d.id, ...d.data()}; (m[row.key] = m[row.key] || []).push(row); });
    S.docsByKey = m; render();
  }, e=>console.warn('documents sub error', e));

  db.collection('stage_overrides').onSnapshot(snap=>{
    const o={};
    snap.docs.forEach(d=>{ o[d.id]=d.data().stage_id; });
    S.stageOverrides = o;
    render();
  }, e=>console.warn('stage_overrides sub error', e));
}

function subscribeAudit(key, cb){
  if(!db || !key) { cb([]); return ()=>{}; }
  return db.collection('audit').where('key','==',key).orderBy('at','desc').limit(25).onSnapshot(snap=>{
    cb(snap.docs.map(d=>d.data()));
  }, e=>{ console.warn('audit sub', e); cb([]); });
}

async function saveTracking(inst, patch){
  if(!db || !inst.key){ toast('Not saved — this record is not part of the current view.'); return; }
  const item = inst.item, key = inst.key;
  const prev = getTrackingKey(key, item);
  const who = ME.name; // the server also stamps this; the browser can't set it
  const next = {...prev, ...patch, last_updated_by: who, updated_at: new Date().toISOString()};
  try{
    await db.doc('tracking/'+key).set(next);
    if(patch.status && patch.status !== prev.status){
      await db.collection('audit').add({
        key, compliance_id: item.compliance_id, project_id: inst.projectId||null, scope_type: inst.scopeType, scope_id: inst.scopeId,
        old_status: prev.status || 'Not Started', new_status: patch.status, who, remark: patch.remarks || '', at: new Date().toISOString()
      });
    }
    const stored = {...next}; delete stored.override_reason;
    S.tracking[key] = stored;
    toast(patch.override_reason ? 'Saved with an override. It is recorded in the audit trail.' : 'Saved.');
    return {ok:true};
  }catch(e){
    if(e && e.status===409 && e.body && e.body.gate) return {blocked:true, message:e.message, canOverride:!!e.body.can_override};
    console.warn(e);
    toast('Save failed: '+(e && e.message || 'error'));
    return {ok:false};
  }
}

const COLLECTIONS = {companies:'companies', projects:'projects', phases:'phases', buildings:'buildings', applicability:'applic'};
/** Re-read some collections right away (instead of waiting for the 5-second refresh). */
async function reloadAll(names){
  await Promise.all(names.map(async n=>{
    const rows = await api('GET', '/api/'+n);
    S[COLLECTIONS[n]] = Object.fromEntries(rows.map(r=>[r.id, r.data]));
  }));
  ensureCtx();
}
/** Ask the server to re-decide applicability for a company/project after setup answers change. */
async function regenerate(scope){
  const r = await api('POST', '/api/generate', scope);
  await reloadAll(['applicability']);
  return r.summary;
}
function summaryText(s){
  const b = s.byStatus||{};
  return `${b['Applicable']||0} applicable · ${b['Pending Review']||0} need review · ${b['Not Applicable']||0} not applicable`;
}

async function saveStageOverride(complianceId, stageId){

function populateProjectSelect(){

  const projOpt = id=>`<option value="p:${esc(id)}">${esc(S.projects[id].name||id)}</option>`;
  const byName = (a,b)=>(S.projects[a].name||'').localeCompare(S.projects[b].name||'');
  const ids = Object.keys(S.projects);
  const cats = [['real_estate','Real estate projects'],['epc','EPC projects']];
  const co = Object.keys(S.companies)[0];
  let html = co ? `<option value="c:${esc(co)}">Company-wide · ${esc(S.companies[co].name||co)}</option>` : '';
  html += cats.map(([cat,label])=>{ const list = ids.filter(id=>categoryOf(S.projects[id])===cat).sort(byName); return list.length ? `<optgroup label="${label}">${list.map(projOpt).join('')}</optgroup>` : ''; }).join('');
  sel.innerHTML = html || '<option value="">No company set up</option>';

function setCtx(value){
  const [kind, id] = [value.slice(0,1), value.slice(2)];
  if(kind==='p' && S.projects[id]) S.ctx = {companyId: S.projects[id].company_id||null, projectId: id};
  else if(kind==='c' && S.companies[id]) S.ctx = {companyId: id, projectId: null};
}
/** Keep the selected company/project valid as data loads or changes. */
function ensureCtx(){
  const p = S.ctx.projectId && S.projects[S.ctx.projectId], c = S.ctx.companyId && S.companies[S.ctx.companyId];
  if(!p && !c){
    const cid = Object.keys(S.companies)[0];
    S.ctx = {companyId: cid||null, projectId: null};
  } else if(S.ctx.projectId && !p) S.ctx = {companyId: S.ctx.companyId, projectId: null};
  populateProjectSelect();
}

function switchView(v){
  S.view = v;
  if(v==='users' && !S.users) loadUsers();
  if(v==='regulatory'){ RU.rows = null; }
  if(v==='documents' && typeof DOC!=='undefined'){ DOC.templates = null; DOC.gen = null; DOC.ana = null; }
  if(v==='vault' && typeof VAULT!=='undefined') VAULT.rows = null;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.view===v));
  render();
}

function render(){
  const main = document.getElementById('main');
  let html = '';
  if(S.items.length===0){ main.innerHTML = '<div class="empty-state">Loading compliance data…</div>'; return; }
  rebuildInstances();
  switch(S.view){
    case 'dashboard': html = renderDashboard(); break;
    case 'stages': html = renderStages(); break;
    case 'calendar': html = renderCalendar(); break;
    case 'register': html = renderRegister(); break;
    case 'regulatory': html = renderRegulatory(); break;
    case 'documents': html = typeof renderDocuments==='function' ? renderDocuments() : '<div class="empty-state">The Documents page did not load. Press Ctrl+F5 to reload the page.</div>'; break;
    case 'vault': html = typeof renderVault==='function' ? renderVault() : '<div class="empty-state">The Document Vault did not load. Press Ctrl+F5 to reload the page.</div>'; break;
    case 'projects': html = renderProjects(); break;
    case 'dq': html = renderDQ(); break;
    case 'users': html = renderUsers(); break;
    case 'settings': html = renderSettings(); break;
  }
  main.innerHTML = html;
  attachViewHandlers();
}

function renderDashboardDetail(){
  if(!S.inst.length) return noContextHtml();
  const insts = S.inst;
  const active = insts.filter(i=>i.state==='active' && i.status!=='Not Applicable');
  const review = insts.filter(i=>i.state==='review').length;
  const na = insts.length - active.length - review;
  const counts = {}; STATUS_LIST.forEach(s=>counts[s]=0);
  let overdue=0, due7=0, due30=0;
  active.forEach(i=>{
    const st = i.status;
    counts[st] = (counts[st]||0)+1;
    if(st==='Overdue') overdue++;
    if(i.tr.next_due_date && st!=='Compliant / Completed' && st!=='On Hold'){
      const d = daysUntil(i.tr.next_due_date);
      if(d!==null && d>=0 && d<=7) due7++;
      if(d!==null && d>=0 && d<=30) due30++;
    }
  });
  const total = active.length;
  const completed = counts['Compliant / Completed']||0;
  const blockedN = active.filter(i=>i.blocked).length;
  const docPending = active.reduce((n,i)=>n+(i.docs?i.docs.pending:0),0);
  const docExpired = active.reduce((n,i)=>n+(i.docs?i.docs.expired+i.docs.rejected:0),0);

  function pctBar(label, done, total, extra, color){
    const raw = total? done/total*100 : 0;
    const pct = raw.toFixed(2);
    // Keep a visible sliver for non-zero counts so a single item doesn't look empty.
    const width = done>0 ? Math.max(raw, 1.5) : 0;
    const countTxt = extra ? ` <span style="color:var(--text-muted)">(${done})</span>` : '';
    return `<div class="bar-row"><div class="lbl" title="${esc(label)}">${esc(label)}</div>
      <div class="bar-track"><div class="bar-seg" style="width:${width}%; background:${color||'var(--accent)'}"></div></div>
      <div class="pct">${pct}%${countTxt}</div></div>`;
  }

  // Not-applicable and still-to-review records are left out of every completion percentage.
  const byDept = {};
  active.forEach(i=>{ const d = i.item.department; byDept[d]=byDept[d]||{done:0,total:0}; byDept[d].total++; if(i.status==='Compliant / Completed') byDept[d].done++; });

  const byStage = {};
  S.stages.forEach(s=>byStage[s.id]={done:0,total:0,name:s.name});
  active.forEach(i=>{
    const sid = effectiveStageId(i.item);
    byStage[sid] = byStage[sid] || {done:0,total:0,name:'Unmapped to Stage'};
    byStage[sid].total++;
    if(i.status==='Compliant / Completed') byStage[sid].done++;
  });

  const topOverdue = active.filter(i=>i.status==='Overdue')
    .map(i=>({i, d: i.tr.next_due_date?daysUntil(i.tr.next_due_date):null})).sort((a,b)=>(a.d??0)-(b.d??0)).slice(0,8);

  return `
    <div class="section-title">Overview — ${esc(ctxName())}</div>
    <div class="grid grid-stats" style="margin-bottom:22px;">
      <div class="stat-tile"><div class="num">${total}</div><div class="label">Applicable items</div></div>
      <div class="stat-tile"><div class="num" style="color:var(--ok)">${completed}</div><div class="label">Compliant / completed</div></div>
      <div class="stat-tile"><div class="num" style="color:var(--bad)">${overdue}</div><div class="label">Overdue</div></div>
      <div class="stat-tile"><div class="num" style="color:var(--warn)">${due7}</div><div class="label">Due in 7 days</div></div>
      <div class="stat-tile"><div class="num" style="color:var(--warn)">${due30}</div><div class="label">Due in 30 days</div></div>
      <div class="stat-tile" title="Waiting for an earlier record to be completed"><div class="num" style="color:var(--hold)">${blockedN}</div><div class="label">Blocked</div></div>
      <div class="stat-tile" title="Uploaded documents nobody has verified yet"><div class="num" style="color:var(--warn)">${docPending}</div><div class="label">Documents awaiting verification</div></div>
      <div class="stat-tile" title="A document has passed its expiry date or was rejected"><div class="num" style="color:var(--bad)">${docExpired}</div><div class="label">Expired / rejected documents</div></div>
      <div class="stat-tile" title="Applicability not yet confirmed. Answer the setup questions in Projects."><div class="num" style="color:var(--hold)">${review}</div><div class="label">Need applicability review</div></div>
      <div class="stat-tile"><div class="num" style="color:var(--text-muted)">${na}</div><div class="label">Not applicable</div></div>
    </div>

    <div class="dash-cols">
      <div class="card">
        <h3 style="margin-bottom:10px;">By status</h3>
        ${STATUS_LIST.filter(s=>s!=='Not Applicable').map(s=>pctBar(s, counts[s]||0, total, true, STATUS_DEFS[s]?`var(--${STATUS_DEFS[s].cls})`:null)).join('')}
      </div>
      <div class="card">
        <h3 style="margin-bottom:10px;">Top overdue items</h3>
        ${topOverdue.length? `<table class="simple"><tr><th>ID</th><th>Description</th><th>Days overdue</th></tr>${
          topOverdue.map(x=>`<tr data-open="${esc(x.i.key)}"><td class="mono">${esc(x.i.item.compliance_id)}</td><td>${esc((x.i.item.brief_description||'').slice(0,46))}${x.i.scopeShort?' · '+esc(x.i.scopeShort):''}</td><td class="mono" style="color:var(--bad)">${Math.abs(x.d)}</td></tr>`).join('')
        }</table>` : '<div style="color:var(--text-muted); font-size:12.5px;">No overdue items right now.</div>'}
      </div>
    </div>

    <div class="section-title">Completion % by stage</div>
    <div class="card">
      ${Object.keys(byStage).map(sid=>pctBar(byStage[sid].name, byStage[sid].done, byStage[sid].total)).join('')}
    </div>

    <div class="section-title">Completion % by department</div>
    <div class="card">
      ${Object.keys(byDept).map(d=>pctBar(d, byDept[d].done, byDept[d].total)).join('')}

/* ============================= STAGES ============================= */
const SF = {dept:'', owner:'', status:'', level:''};   // Stages-page filters
const OPEN_STAGES = new Set(['S0','S1']);                // which stages are expanded (kept across re-renders)
function stageStats(insts){
  const c = {total:insts.length, na:0, review:0, done:0, overdue:0, pending:0, started:0, blocked:0};
  insts.forEach(i=>{
    const st = i.status;
    if(i.blocked) c.blocked++;
    if(st==='Not Applicable') c.na++;
    else if(i.state==='review') c.review++;
    else if(st==='Compliant / Completed') c.done++;
    else if(st==='Overdue') c.overdue++;
    else { c.pending++; if(st!=='Not Started') c.started++; }
  });
  c.applicable = c.done + c.overdue + c.pending;     // confirmed applicable
  c.pct = c.applicable ? Math.round(c.done/c.applicable*100) : 0;
  return c;
}
/** Small chips shown beside a status: waiting on a prerequisite, ready to start, document problems. */
function flagChips(i){
  if(i.state!=='active' || i.status==='Compliant / Completed') return '';
  const chips = [];
  if(i.blocked) chips.push(`<span class="chip hold" title="Waiting for: ${esc(i.blockedBy.map(b=>b.id).join(', '))}">Blocked</span>`);
  else if(i.ready) chips.push('<span class="chip ok" title="All prerequisites are complete">Ready to start</span>');
  if(i.docs){
    if(i.docs.rejected) chips.push('<span class="chip bad">Doc rejected</span>');
    if(i.docs.expired) chips.push('<span class="chip bad">Doc expired</span>');
    if(i.docs.pending) chips.push('<span class="chip warn">Doc awaiting verification</span>');
  }
  return chips.length ? `<div class="flag-chips">${chips.join('')}</div>` : '';
}
function stageStatusLabel(c){
  if(!c.applicable) return c.review ? {txt:'Needs review', cls:'hold'} : {txt:'Nothing applicable', cls:''};
  if(c.done===c.applicable) return {txt:'Complete', cls:'ok'};
  if(c.overdue) return {txt:'Overdue items', cls:'bad'};
  if(c.done || c.started) return {txt:'In progress', cls:'warn'};
  return {txt:'Not started', cls:''};
}

/* Stage 0: the set-up steps for the selected company or project (they decide what applies). */
function setupSteps(){
  const review = S.inst.filter(i=>i.state==='review').length;
  if(S.ctx.projectId){
    const id = S.ctx.projectId, p = S.projects[id];
    if(!p) return {kind:'project', id, steps:[]};
    const epc = categoryOf(p)==='epc', un = unansweredFor(id);
    const blds = Object.values(S.buildings).filter(b=>b.project_id===id);
    const phs = Object.values(S.phases).filter(x=>x.project_id===id);
    return {kind:'project', id, steps: epc ? [
      ['Site entered', !!p.location],
      ['Project questions answered', un.proj.length===0],
      ['Company answers it depends on', un.comp.length===0],
      ['No applicability left to review', review===0],
    ] : [
      ['Basics entered (location or authority, and type)', !!(p.location||p.planning_authority) && !!p.project_type],
      ['Site or built-up area entered', !!(p.site_area_ha||p.built_up_area_sqm)],
      ['Project questions answered', un.proj.length===0],
      ['At least one phase', phs.length>0],
      ['Buildings added and their questions answered', blds.length>0 && un.blds.length===0],
      ['Company answers it depends on', un.comp.length===0],
      ['No applicability left to review', review===0],
    ]};
  }
  const id = S.ctx.companyId, co = S.companies[id];
  if(!co) return {kind:'company', id, steps:[]};
  return {kind:'company', id, steps:[
    ['Employee count entered', co.employee_count!=null && co.employee_count!==''],
    ['Company questions answered', unansweredCompany().length===0],
    ['No applicability left to review', review===0],
  ]};
}

function renderStages(){
  if(!S.inst.length && !S.ctx.projectId && !S.ctx.companyId) return noContextHtml();

  const sel = (key,label,opts)=>`<label>${label}<select data-sf="${key}"><option value="">All</option>${opts.map(o=>`<option value="${esc(o)}" ${SF[key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
  const matches = i=>(!SF.dept||i.item.department===SF.dept) && (!SF.owner||i.item.owner===SF.owner) && (!SF.status||i.status===SF.status) && (!SF.level||i.item.compliance_level===SF.level);

  const grouped = {};
  S.stages.forEach(s=>grouped[s.id]={stage:s, items:[]});
  S.inst.filter(matches).forEach(i=>{
    const sid = effectiveStageId(i.item);
    if(!grouped[sid]) grouped[sid]={stage:{id:sid,name:'Unmapped to Stage',order:999,description:''}, items:[]};
    grouped[sid].items.push(i);
  });
  const filtering = SF.dept||SF.owner||SF.status||SF.level;
  const ordered = Object.values(grouped).filter(g=>g.stage.id!=='UNMAPPED'||g.items.length).sort((a,b)=>a.stage.order-b.stage.order);
  const stats = Object.fromEntries(ordered.map(g=>[g.stage.id, stageStats(g.items)]));
  const stageNum = id=>id.replace(/^S/,'Stage ');

  return `
    <div class="filters">

      ${sel('level','Compliance level',pick(i=>i.item.compliance_level))}
      ${sel('owner','Owner',pick(i=>i.item.owner))}
      ${sel('status','Status',STATUS_LIST)}
      ${filtering?'<button class="btn" id="sfClear" type="button">Clear filters</button>':''}
      <span style="margin-left:auto;font-size:12px;color:var(--text-muted);">Showing: <b style="color:var(--text)">${esc(ctxName())}</b> — change it with the selector at the top</span>
    </div>
    <div class="legend">
      ${Object.entries(STATUS_DEFS).map(([k,v])=>`<span><i style="background:var(--${v.cls})"></i>${k}</span>`).join('')}
    </div>
    ${ordered.map(g=>{
      const sid = g.stage.id, c = stats[sid], lab = stageStatusLabel(c);
      const isSetup = sid==='S0';
      const pct = isSetup ? (setup.steps.length ? Math.round(setupDone/setup.steps.length*100) : 0) : c.pct;
      const prereq = (g.stage.prerequisites||[]).map(stageNum).join(', ');
      return `
      <div class="stage-block ${OPEN_STAGES.has(sid)?'open':''}" data-stage="${esc(sid)}">
        <div class="stage-head" data-toggle="${esc(sid)}">
          <span class="stage-chevron">▶</span>
          <div class="stage-title"><h3>${esc(g.stage.name)}</h3></div>
          <div class="stage-progress"><div class="bar-track"><div class="bar-seg" style="width:${pct}%;background:var(--accent)"></div></div></div>
          <div class="stage-count">${isSetup ? setupDone+'/'+setup.steps.length : c.pct+'% · '+c.done+'/'+c.applicable}</div>
        </div>
        <div class="stage-items">
          <div class="stage-intro">
            ${g.stage.description?`<div class="stage-desc stage-desc-open">${esc(g.stage.description)}</div>`:''}
            <div class="stage-chips">
              ${isSetup
                ? `<span class="chip ${setupDone===setup.steps.length&&setup.steps.length?'ok':'warn'}">${setupDone} of ${setup.steps.length} set-up steps done</span>`
                : `<span class="chip ${lab.cls}">${lab.txt}</span>
              <span class="chip">${c.applicable} applicable</span>
              <span class="chip ok">${c.done} completed</span>
              <span class="chip warn">${c.pending} pending</span>
              <span class="chip ${c.overdue?'bad':''}">${c.overdue} overdue</span>
              <span class="chip ${c.blocked?'hold':''}" title="Waiting for an earlier record to be completed">${c.blocked} blocked</span>
              ${c.review?`<span class="chip hold" title="Applicability not confirmed yet">${c.review} to review</span>`:''}
              <span class="chip">${c.na} not applicable</span>`}
              ${prereq&&!isSetup?`<span class="chip hold" title="Proposed sequence, not yet legally validated">Usually after ${prereq}</span>`:''}
            </div>
          </div>
          ${isSetup ? `<div class="stage-note">
              ${setup.steps.map(s=>`<div class="doc-check ${s[1]?'done':'pending'}"><span class="st">${s[1]?'✓':'○'}</span><span style="flex:1">${esc(s[0])}</span></div>`).join('') || 'Select a company or project at the top.'}
              <div style="margin-top:10px;"><button class="btn primary" data-setup="${setup.kind}:${esc(setup.id||'')}" type="button" ${setup.id?'':'disabled'}>Open ${setup.kind} set-up</button></div>
            </div>`
          : g.items.length ? `<div class="item-row-header"><div>ID</div><div>What to do</div><div>Owner</div><div>Next due</div><div>Status</div></div>
          ${g.items.map(i=>{
            const it = i.item, st = i.status;
            const sdef = STATUS_DEFS[st]||STATUS_DEFS['Not Started'];
            const review = i.state==='review';
            return `<div class="item-row" data-open="${esc(i.key)}">
              <div class="idcell" data-lbl="ID">${esc(it.compliance_id)}</div>

                <div class="d1">${esc(it.brief_description||'')}</div>

        </div>
      </div>`;
    }).join('')}
    ${S.ctx.projectId && categoryOf(S.projects[S.ctx.projectId])!=='epc' && Object.values(S.buildings).every(b=>b.project_id!==S.ctx.projectId) ? '<div class="stage-note card" style="margin-top:12px;">No buildings are added to this project yet, so building-level requirements (lift licence, occupancy certificate, fire NOC, plinth checking…) are not listed. Add buildings in the project set-up.</div>' : ''}
    ${S.ctx.projectId ? '<div class="stage-note" style="margin-top:6px;">Company-wide obligations (tax, labour, corporate, data protection) are tracked once for the company, not per project. Switch the selector to “Company-wide” to see them.</div>' : ''}
  `;
}

/* ============================= CALENDAR ============================= */
function monthMatrix(year, month){
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const days = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=days; d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);
  return cells;
}
function itemsByDueDate(){
  const map = {}; const undated=[];
  S.inst.forEach(inst=>{
    if(inst.state!=='active' || inst.status==='Not Applicable') return;   // not-applicable and unreviewed items stay off the calendar
    const it = inst.item, tr = inst.tr;
    if(tr.next_due_date){
      map[tr.next_due_date] = map[tr.next_due_date]||[];
      map[tr.next_due_date].push({inst, it, tr});
    } else if(it.due_date_parse_status==='undated_by_nature' || it.due_date_parse_status==='due_date_to_be_set' || it.due_date_parse_status==='unparsed'){
      undated.push({inst, it, tr});
    }
  });

// Event-based / ongoing list: searchable table, shown 50 rows at a time.
const UND = { q:'', n:50 };
function undatedRowsHtml(undated){
  const q = UND.q.trim().toLowerCase();
  const rows = undated.filter(e=>!q || [e.it.compliance_id, e.it.brief_description, e.it.department, e.inst.scopeShort, e.inst.status].join(' ').toLowerCase().includes(q));
  if(!rows.length) return `<div class="empty-state">${undated.length?'No compliances match your search.':'No event-based compliances.'}</div>`;
  const shown = rows.slice(0, UND.n);
  return `<div class="und-count">${q?`${rows.length} of ${undated.length}`:undated.length} compliance${rows.length===1?'':'s'}</div>
    <div class="table-wrap"><table class="und-table"><thead><tr><th>ID</th><th>Compliance</th><th>Department</th><th>Applies to</th><th>Status</th></tr></thead><tbody>
    ${shown.map(e=>{ const sdef = STATUS_DEFS[e.inst.status]||STATUS_DEFS['Not Started'];
      return `<tr data-und="${esc(e.inst.key)}"><td class="mono">${esc(e.it.compliance_id)}</td><td><div class="und-desc">${esc(e.it.brief_description||'')}</div></td><td>${esc(e.it.department||'')}</td><td>${esc(e.inst.scopeShort||'Entity')}</td><td><span class="badge ${sdef.cls}">${esc(e.inst.status)}</span></td></tr>`; }).join('')}
    </tbody></table></div>
    ${rows.length>shown.length?`<div style="text-align:center;margin-top:10px"><button class="btn sm" id="undMore" type="button">Show ${Math.min(50, rows.length-shown.length)} more (${rows.length-shown.length} remaining)</button></div>`:''}`;
}
function attachUndated(){
  const q = document.getElementById('undQ'), body = document.getElementById('undBody'); if(!q || !body) return;
  const {undated} = itemsByDueDate();
  const redraw = ()=>{ body.innerHTML = undatedRowsHtml(undated); };
  q.oninput = ()=>{ UND.q = q.value; UND.n = 50; redraw(); };
  body.addEventListener('click', ev=>{
    if(ev.target.closest('#undMore')){ UND.n += 50; redraw(); return; }
    const tr = ev.target.closest('[data-und]'); if(tr) openDrawer(tr.getAttribute('data-und'));
  });
}
function buildICS(){
  const {map} = itemsByDueDate();
  let lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Compliance Tracker//EN'];
  Object.keys(map).forEach(dateStr=>{
    map[dateStr].forEach(({it, inst})=>{
      const dt = dateStr.replace(/-/g,'');
      lines.push('BEGIN:VEVENT');
      lines.push('UID:'+inst.key+'-'+dateStr+'@compliance-tracker');
      lines.push('DTSTART;VALUE=DATE:'+dt);
      lines.push('SUMMARY:'+it.compliance_id+(inst.scopeShort?' ('+inst.scopeShort+')':'')+' — '+(it.brief_description||'').replace(/\n/g,' ').slice(0,120));
      lines.push('DESCRIPTION:'+(it.action_required||'').replace(/\n/g,' ').slice(0,500).replace(/,/g,'\\,'));
      lines.push('END:VEVENT');
    });
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

/* ---------- small building blocks for the set-up forms ---------- */
function segHtml(key, val){
  const b = (v,label,cls)=>`<button type="button" class="seg-btn ${val===v?'on '+cls:''}" data-segval="${v}">${label}</button>`;
  return `<div class="seg" data-fact="${key}" data-val="${val}">${b('true','Yes','yes')}${b('false','No','no')}${b('','Not sure','unk')}</div>`;
}
function question(key, facts, ent, affects, readonly){
  const def = S.cat.flags[key];
  const v = facts && typeof facts[key]==='boolean' ? String(facts[key]) : '';
  const st = Core.flagState(S.cat, key, ent);
  const note = v==='' && st.how==='derived' ? `Worked out from your numbers: <b>${st.value?'Yes':'No'}</b>` : `Decides ${affects} record${affects===1?'':'s'}`;
  return `<div class="q ${readonly?'ro':''}"><div class="q-text">${esc(def.question)}<div class="q-sub">${note}</div></div>${segHtml(key, v)}</div>`;
}
function questionGroups(scope, rel, facts, ent, readonly){
  const keys = Object.keys(rel).filter(k=>S.cat.flags[k].scope===scope);
  if(!keys.length) return '<div class="muted" style="font-size:12.5px;">No questions here — everything in this section applies automatically.</div>';
  const groups = {};
  keys.forEach(k=>{ (groups[S.cat.flags[k].group] = groups[S.cat.flags[k].group] || []).push(k); });
  return Object.keys(groups).sort((a,b)=>GROUP_ORDER.indexOf(a)-GROUP_ORDER.indexOf(b)).map(g=>`
    <div class="q-group"><h5>${esc(g)}</h5>${groups[g].map(k=>question(k, facts, ent, rel[k], readonly)).join('')}</div>`).join('');
}
function collectFacts(root, scope){
  const facts = {};
  root.querySelectorAll(`[data-factscope="${scope}"] [data-fact]`).forEach(el=>{
    const v = el.dataset.val; if(v==='true') facts[el.dataset.fact] = true; else if(v==='false') facts[el.dataset.fact] = false;
  });
  return facts;
}
/** One handler for every Yes / No / Not sure control inside a modal. */
function wireSegments(root){

}

/* ---------- company set-up (there is only one company) ---------- */
function openCompanySetup(id){
  const c = S.companies[id]; if(!c) return;
  const ro = !canManageCompany();
  const rel = Core.relevantFlags(worldData(), S.cat, {companyId:id});
  const un = unansweredCompany();
  const review = S.inst.filter(()=>false).length;
  const waiting = Object.values(S.applic).filter(d=>d.company_id===id && Core.stateOf(d.status)==='review').length;
  const steps = [['Number of employees entered', c.employee_count!=null&&c.employee_count!==''], ['Company questions answered', un.length===0]];
  const done = steps.filter(s=>s[1]).length;
  const d = showModal(`
    <div class="modal-head"><div style="flex:1"><div class="modal-badges"><span class="modal-id mono">Company set-up</span></div><h3 class="modal-title">${esc(c.name)} — company-wide</h3></div><button class="drawer-close" id="drawerClose" aria-label="Close">✕</button></div>

        <div class="field" style="max-width:260px;margin-left:34px;"><label>Number of employees</label><input id="coEmp" type="number" min="0" value="${c.employee_count!=null?esc(c.employee_count):''}" ${ro?'disabled':''}></div>
      </section>
      <section class="step" data-factscope="company">${stepHead(2,'Company questions','These decide which company-wide obligations apply. Pick <b>Not sure</b> if you do not know yet; the record stays in your review list until you answer.', steps[1][1])}

      </section>

  const save = d.querySelector('#coSave');
