/* ---------- project set-up ---------- */
function openProjectSetup(id){
  const p = S.projects[id]; if(!p) return;
  const epc = categoryOf(p)==='epc';
  const can = canManageSetup(), ro = !can;
  const co = S.companies[p.company_id];
  const phases = Object.entries(S.phases).filter(([,x])=>x.project_id===id);
  const blds = Object.entries(S.buildings).filter(([,x])=>x.project_id===id);
  const rel = Core.relevantFlags(worldData(), S.cat, {projectId:id});
  const un = unansweredFor(id);
  const insts = Core.enumerate(worldData(), {projectId:id}).map(decorateInst);
  const review = insts.filter(i=>i.state==='review');
  const dis = ro ? 'disabled' : '';
  const coFlagsNeeded = Object.keys(rel).some(k=>S.cat.flags[k].scope==='company');

  const steps = epc ? [
    ['Where the site is', !!p.location],
    ['Contract workers', p.contract_workers_count!=null || un.proj.length===0],
    ['Project questions', un.proj.length===0],
    ['Company answers it depends on', !coFlagsNeeded || un.comp.length===0],
    ['Nothing left to review', review.length===0],
  ] : [
    ['Basics', !!(p.location||p.planning_authority) && !!p.project_type],
    ['Size', !!(p.site_area_ha||p.built_up_area_sqm)],
    ['Project questions', un.proj.length===0],
    ['Phases', phases.length>0],
    ['Buildings', blds.length>0 && un.blds.length===0],
    ['Company answers it depends on', !coFlagsNeeded || un.comp.length===0],
    ['Nothing left to review', review.length===0],
  ];
  const done = steps.filter(s=>s[1]).length;
  let n = 0;
  const field = (label, html, hint)=>`<div class="field"><label>${label}</label>${html}${hint?`<div class="fact-sub">${hint}</div>`:''}</div>`;
  const inp = (idv, val, extra='')=>`<input id="${idv}" value="${esc(val==null?'':val)}" ${dis} ${extra}>`;

  const basics = epc ? `
      ${stepHead(++n,'Where the site is','Enter the site so the project can be told apart from others with a similar name.', steps[0][1])}
      <div class="step-body setup-grid">
        ${field('Project name', inp('spName',p.name))}
        ${field('Site (city, state)', inp('spLocation',p.location, 'placeholder="e.g. Satara, Maharashtra"'))}
        ${field('Client / owner (optional)', inp('spClient',p.client, 'placeholder="e.g. PWD"'))}
        ${field('Current work stage (optional)', inp('spStage',p.current_stage))}
        ${field('Project manager (optional)', inp('spPm',p.project_manager))}
        ${field('Compliance manager (optional)', inp('spCm',p.compliance_manager))}
      </div>` : `
      ${stepHead(++n,'Basics','The essentials about the project.', steps[0][1])}
      <div class="step-body setup-grid">
        ${field('Project name', inp('spName',p.name))}
        ${field('MahaRERA registration no.', inp('spRera',p.rera_no, 'placeholder="P5XXXX000XXXX"'))}
        ${field('Location (city, state)', inp('spLocation',p.location, 'placeholder="e.g. Pune, Maharashtra"'))}
        ${field('Planning authority', inp('spAuthority',p.planning_authority, 'placeholder="e.g. Pune Municipal Corporation"'))}
        ${field('Project type', `<select id="spType" ${dis}><option value="">Choose…</option>${PROJECT_TYPES.map(t=>`<option ${p.project_type===t?'selected':''}>${t}</option>`).join('')}</select>`)}
        ${field('Current construction stage (optional)', inp('spStage',p.current_stage))}
        ${field('Project manager (optional)', inp('spPm',p.project_manager))}
        ${field('Compliance manager (optional)', inp('spCm',p.compliance_manager))}
      </div>`;

  const sizeStep = epc ? `
      ${stepHead(++n,'Contract workers','How many contract workers are engaged on this site? 20 or more triggers the principal-employer registration rules.', steps[1][1])}
      <div class="step-body setup-grid">${field('Contract workers on site', inp('spCw',p.contract_workers_count,'type="number" min="0"'), 'You can leave this blank and answer the Yes / No question below instead.')}</div>` : `
      ${stepHead(++n,'Size','Areas are used to work out whether an Environmental Clearance is needed (20,000 sq m built-up or 50 ha site). Contract workers decide the labour-contractor rules.', steps[1][1])}
      <div class="step-body setup-grid">
        ${field('Site area (hectares)', inp('spSite',p.site_area_ha,'type="number" min="0" step="any"'))}
        ${field('Built-up area (sq m)', inp('spBua',p.built_up_area_sqm,'type="number" min="0" step="any"'))}
        ${field('Contract workers on site', inp('spCw',p.contract_workers_count,'type="number" min="0"'))}
      </div>`;

  const qStep = `
      ${stepHead(++n,'Project questions','Answer Yes or No. Each answer switches the related records on or off. <b>Not sure</b> keeps them in your review list.', steps[2][1])}
      <div class="step-body" data-factscope="project">${questionGroups('project', rel, p.facts, {company:co, project:p}, ro)}</div>`;

  const phaseStep = epc ? '' : `
      ${stepHead(++n,'Phases','Each phase is registered with RERA separately, so phase-level records are tracked once per phase.', steps[3][1])}
      <div class="step-body">
        ${phases.map(([pid,x])=>`<div class="setup-row"><span style="flex:1"><b>${esc(x.name)}</b>${x.rera_no?` <span class="mono muted">${esc(x.rera_no)}</span>`:''}</span>${can?`<button class="btn sm" data-delphase="${esc(pid)}" type="button">Remove</button>`:''}</div>`).join('') || '<div class="muted">No phases yet.</div>'}
        ${can?`<div class="setup-add"><input id="phName" placeholder="Add a phase, e.g. Phase 2"><input id="phRera" placeholder="RERA no. (optional)"><button class="btn" id="phAdd" type="button">Add phase</button></div>`:''}
      </div>`;

  const bldStep = epc ? '' : `
      ${stepHead(++n,'Buildings','Add each building or tower. Lift licences, fire NOC, plinth checking and occupancy certificate are tracked separately for every building.', steps[4][1])}
      <div class="step-body">
        ${blds.map(([bid,b])=>`<div class="setup-row" data-bldrow="${esc(bid)}"><span style="flex:1;min-width:120px"><b>${esc(b.name)}</b> <span class="muted">· ${esc((S.phases[b.phase_id]||{}).name||'no phase')}</span></span>
          <span class="muted" style="font-size:12px;">Has a lift?</span>${segHtml('has_lift', typeof (b.facts||{}).has_lift==='boolean'?String(b.facts.has_lift):'')}
          ${can?`<button class="btn sm" data-delbld="${esc(bid)}" type="button">Remove</button>`:''}</div>`).join('') || '<div class="muted">No buildings yet. Until you add one, building-level records are not listed.</div>'}
        ${can?`<div class="setup-add"><input id="bName" placeholder="Building name, e.g. Tower A"><select id="bPhase">${phases.map(([pid,x])=>`<option value="${esc(pid)}">${esc(x.name)}</option>`).join('')}</select>
          <div class="seg" id="bLift" data-val=""><button type="button" class="seg-btn" data-segval="true">Lift</button><button type="button" class="seg-btn" data-segval="false">No lift</button><button type="button" class="seg-btn on unk" data-segval="">Not sure</button></div>
          <button class="btn" id="bAdd" type="button">Add building</button></div>`:''}
      </div>`;

  const coStep = `
      ${stepHead(++n,'Company answers it depends on', coFlagsNeeded ? `Some records here also depend on company-wide answers (for example whether the company is covered by EPF${epc?' or processes personal data':''}).` : 'Nothing here depends on company-wide answers.', steps[epc?3:5][1])}
      ${coFlagsNeeded ? `<div class="step-body">${un.comp.length?`<span class="chip warn">${un.comp.length} company question${un.comp.length>1?'s':''} open</span> `:'<span class="chip ok">All answered</span> '}<a href="#" id="toCompany">Open company set-up</a></div>`:''}`;

  const reviewStep = `
      ${stepHead(++n,'Waiting for review ('+review.length+')', review.length?'These records are not confirmed as applicable yet. Answering the questions above settles most of them. You can also open one and decide it yourself.':'Every record for this project has a confirmed applicability.', steps[steps.length-1][1])}
      ${review.length?`<div class="step-body">${review.slice(0,10).map(i=>`<div class="setup-row clickable" data-open="${esc(i.key)}"><span class="mono" style="min-width:76px">${esc(i.item.compliance_id)}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((i.item.brief_description||'').slice(0,70))}${i.scopeShort?' · '+esc(i.scopeShort):''}</span></div>`).join('')}${review.length>10?`<div class="fact-sub">+${review.length-10} more</div>`:''}</div>`:''}`;

  const d = showModal(`
    <div class="modal-head"><div style="flex:1"><div class="modal-badges"><span class="modal-id mono">Project set-up</span><span class="badge neutral">${epc?'EPC project':'Real estate project'}</span></div><h3 class="modal-title">${esc(p.name)}</h3></div><button class="drawer-close" id="drawerClose" aria-label="Close">✕</button></div>
    <div class="modal-body">
      ${progressBar(done, steps.length, review.length)}
      ${ro?'<div class="readonly-note">Your role can view this set-up but not change it.</div>':''}
      ${p.notes?`<div class="readonly-note" style="border-left:3px solid var(--warn)">${esc(p.notes)}</div>`:''}
      ${epc?'<div class="readonly-note">EPC projects track local-level <b>contract labour</b> and <b>IT</b> compliance only. That is why there are no phases, buildings or RERA questions here.</div>':''}
      <section class="step">${basics}</section>
      <section class="step">${sizeStep}</section>
      <section class="step">${qStep}</section>
      ${phaseStep?`<section class="step">${phaseStep}</section>`:''}
      ${bldStep?`<section class="step">${bldStep}</section>`:''}
      <section class="step">${coStep}</section>
      <section class="step">${reviewStep}</section>
    </div>
    ${can?'<div class="modal-foot"><button class="btn primary" id="spSave" type="button">Save &amp; re-check applicability</button><span class="muted" style="font-size:12px;">Saves every answer on this page, then works out which records apply.</span></div>':''}`);

  d.querySelectorAll('[data-open]').forEach(a=>a.addEventListener('click', ()=>openDrawer(a.getAttribute('data-open'))));
  const toCo = d.querySelector('#toCompany'); if(toCo) toCo.onclick = e=>{ e.preventDefault(); openCompanySetup(theCompanyId()); };
  const after = async (msg)=>{ await reloadAll(['projects','phases','buildings']); const s = await regenerate({projectId:id}); toast((msg?msg+' ':'')+summaryText(s)); render(); openProjectSetup(id); };
  const guard = fn=>async (...a)=>{ try{ await fn(...a); }catch(e){ toast('Failed: '+e.message); } };
  const v = sel=>{ const e = d.querySelector(sel); return e ? e.value.trim() : null; };

  const save = d.querySelector('#spSave');
  if(save) save.onclick = guard(async ()=>{
    save.disabled = true;
    const next = {...p, name: v('#spName')||p.name, location: v('#spLocation'), current_stage: v('#spStage')||'', project_manager: v('#spPm')||'', compliance_manager: v('#spCm')||'', facts: collectFacts(d,'project')};
    if(epc){ next.client = v('#spClient')||''; next.contract_workers_count = numOrNull(v('#spCw')); }
    else Object.assign(next, {rera_no: v('#spRera')||'', planning_authority: v('#spAuthority')||'', project_type: v('#spType')||'', site_area_ha: numOrNull(v('#spSite')), built_up_area_sqm: numOrNull(v('#spBua')), contract_workers_count: numOrNull(v('#spCw'))});
    await db.doc('projects/'+id).set(next);
    // building lift answers
    for(const row of d.querySelectorAll('[data-bldrow]')){
      const bid = row.dataset.bldrow, b = S.buildings[bid]; if(!b) continue;
      const val = row.querySelector('[data-fact="has_lift"]').dataset.val;
      const was = typeof (b.facts||{}).has_lift==='boolean' ? String(b.facts.has_lift) : '';
      if(val!==was){ const facts = {...(b.facts||{})}; delete facts.has_lift; if(val!=='') facts.has_lift = val==='true'; await db.doc('buildings/'+bid).set({...b, facts}); }
    }
    await after('Saved.');
  });
  const phAdd = d.querySelector('#phAdd');
  if(phAdd) phAdd.onclick = guard(async ()=>{
    const name = v('#phName'); if(!name){ toast('Enter a phase name.'); return; }
    await db.doc('phases/ph_'+slug(name)+'_'+uid()).set({project_id:id, name, rera_no: v('#phRera')||'', created_at:new Date().toISOString()});
    await after('Phase added.');
  });
  const bAdd = d.querySelector('#bAdd');
  if(bAdd) bAdd.onclick = guard(async ()=>{
    const name = v('#bName'); if(!name){ toast('Enter a building name.'); return; }
    const lift = d.querySelector('#bLift').dataset.val;
    await db.doc('buildings/bld_'+slug(name)+'_'+uid()).set({project_id:id, phase_id:d.querySelector('#bPhase').value||null, name, facts: lift===''?{}:{has_lift: lift==='true'}, created_at:new Date().toISOString()});
    await after('Building added.');
  });
  const del = (attr, col, label)=>d.querySelectorAll(`[${attr}]`).forEach(b=>b.onclick = guard(async ()=>{
    if(!window.confirm(`Remove this ${label}?`)) return;
    await api('DELETE', `/api/${col}/${encodeURIComponent(b.getAttribute(attr))}`);
    await after(label[0].toUpperCase()+label.slice(1)+' removed.');
  }));
  del('data-delphase','phases','phase'); del('data-delbld','buildings','building');
}

/* ============================= DATA QUALITY ============================= */
function renderDQ(){
  const unparsedDue = S.items.filter(i=>i.due_date_parse_status==='unparsed');
  const toBeSet = S.items.filter(i=>i.due_date_parse_status==='due_date_to_be_set');
  const noOwner = S.items.filter(i=>i.owner==='Unassigned');
  const noApprover = S.items.filter(i=>i.approver==='Unassigned');
  const unmapped = S.items.filter(i=>effectiveStageId(i)==='UNMAPPED');
  const otherFreq = S.items.filter(i=>i.frequency_norm==='Other / Unparsed');
  const brokenId = S.items.filter(i=>i.compliance_id_source_formula_broken);
  const lowConf = S.items.filter(i=>i.stage_confidence==='low');
  const dupes = S.items.filter(i=>i.duplicate_group);
  const noDeadline = S.items.filter(i=>i.deadline_rule && i.deadline_rule.type==='unknown');
  const noTrigger = S.items.filter(i=>i.frequency_norm==='Event Based' && !i.trigger);
  const noDocs = S.items.filter(i=>!String(i.forms_documents||'').trim());
  const noLegalRef = S.items.filter(i=>!String(i.regulation||'').trim());
  const legalPending = S.items.filter(i=>i.legal_validation_status && i.legal_validation_status!=='Validated').length;
  const badChars = S.items.filter(i=>/â€|â‚|Ã/.test(JSON.stringify([i.brief_description,i.action_required,i.penalty,i.applicability])));
  // Set-up checks (companies, projects, phases, buildings, applicability decisions)
  const pName = id=>(S.projects[id]||{}).name||id;
  const setupIssues = [];
  Object.entries(S.projects).forEach(([id,p])=>{
    if(!p.company_id || !S.companies[p.company_id]) setupIssues.push([pName(id), 'No valid company assigned']);
    if(!p.location && !p.planning_authority) setupIssues.push([pName(id), 'Location / planning authority not entered']);
    if(categoryOf(p)==='epc') return;      // EPC projects only track contract labour and IT, so the checks below don't apply
    if(!p.project_type) setupIssues.push([pName(id), 'Project type not chosen']);
    if(!p.site_area_ha && !p.built_up_area_sqm) setupIssues.push([pName(id), 'No site or built-up area (needed for the Environmental Clearance threshold)']);
    if(!Object.values(S.buildings).some(b=>b.project_id===id)) setupIssues.push([pName(id), 'No buildings added, so building-level records are not listed']);
  });
  Object.entries(S.buildings).forEach(([id,b])=>{
    if(!S.projects[b.project_id]) setupIssues.push([b.name||id, 'Building points to a project that does not exist']);
    if(typeof (b.facts||{}).has_lift!=='boolean') setupIssues.push([`${pName(b.project_id)} · ${b.name}`, 'Lift question not answered']);
  });
  Object.entries(S.companies).forEach(([id,c])=>{
    if(c.employee_count==null||c.employee_count==='') setupIssues.push([c.name, 'Employee count not entered']);
    const m = unansweredCompany().length;
    if(m) setupIssues.push([c.name, `${m} company set-up question(s) unanswered`]);
  });
  const reviewDecisions = Object.values(S.applic).filter(d=>Core.stateOf(d.status)==='review');
  const reviewByProject = {};
  reviewDecisions.forEach(d=>{ const k = d.project_id ? pName(d.project_id) : ((S.companies[d.company_id]||{}).name||'Company-wide'); reviewByProject[k] = (reviewByProject[k]||0)+1; });
  const plain = (title, rows, note)=>`<div class="dq-group"><h3>${esc(title)} <span class="mono" style="color:var(--text-muted); font-weight:400;">(${rows.length})</span></h3>
      ${note?`<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">${note}</div>`:''}
      <div class="dq-list">${rows.slice(0,40).map(r=>`<div class="dq-item" style="cursor:default"><span>${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join('')}</div></div>`;

  function group(title, list, note){
    return `<div class="dq-group"><h3>${esc(title)} <span class="mono" style="color:var(--text-muted); font-weight:400;">(${list.length})</span></h3>
      ${note?`<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">${note}</div>`:''}
      <div class="dq-list">${list.slice(0,40).map(it=>`<div class="dq-item" data-open="${esc(it.compliance_id)}"><span class="mono">${esc(it.compliance_id)}</span><span>${esc((it.brief_description||'').slice(0,70))}</span></div>`).join('')}
      ${list.length>40?`<div class="dq-item" style="color:var(--text-muted)">+${list.length-40} more — see Master Register.</div>`:''}
      </div></div>`;
  }
  return `
    ${group('Compliance ID / Sr No formula broken in source (recomputed)', brokenId, 'The Excel\'s own Sr No formula breaks from row 19 onward (a `=#REF!+1` chain). IDs shown throughout this app are recomputed, not guessed — same logic as the sheet\'s formula, applied per department.')}
    ${group('Due date unparsed (free text, not auto-converted)', unparsedDue, 'Open the item and set a concrete next due date manually.')}
    ${group('Due date to be set (blank in source)', toBeSet)}
    ${group('Owner unassigned', noOwner)}
    ${group('Approver unassigned', noApprover)}
    ${group('Unmapped to a process stage', unmapped, 'Needs a reviewer to assign a stage.')}
    ${group('Stage placement is low-confidence', lowConf, 'The stage was proposed by rule from the item text; the source was unclear. Review the "Why this stage" note in each item.')}
    ${group('Possible duplicate obligations', dupes, 'These records restate the same obligation under different departments. They are kept separate and linked; confirm or consolidate after review.')}
    ${group('No deadline information', noDeadline, 'Frequency and due date are both unspecified. Shown as "Deadline Pending Validation"; no date has been invented.')}
    ${group('Event-based but no trigger recorded', noTrigger)}
    ${group('No forms / documents listed', noDocs, 'The document checklist for these items is empty; use "Other document" when uploading.')}
    ${group('No regulation / legal reference', noLegalRef)}
    ${group('Text with broken characters (encoding)', badChars, 'Characters such as "₹" are an encoding fault in the source import (₹ saved incorrectly). The legal text was left unchanged.')}
    ${plain('Set-up gaps (companies, projects, buildings)', setupIssues, 'Complete these in Projects → Set up so the right records apply.')}
    ${plain('Applicability waiting for a decision', Object.entries(reviewByProject), 'Records whose applicability is not confirmed yet. The second column is how many.')}
    ${S.coverage ? plain('Laws the register does not mention (coverage review)', S.coverage.gaps.map(g=>[g.law, `${g.applies_to.map(a=>a==='epc'?'EPC':'Real estate').join(' & ')} · ${g.when}`]),
      'A first-pass AI check of the register against laws that typically apply to real estate developers and EPC contractors. It is not legal advice. “Not found” means no register record names the law, not that the law is being breached. Ask counsel to confirm each one before a record is added. Full list: data-prep/coverage-review.md.') : ''}
    <div class="dq-group"><h3>Legal validation <span class="mono" style="color:var(--text-muted); font-weight:400;">(${legalPending} of ${S.items.length})</span></h3>
      <div style="font-size:12px;color:var(--text-muted);">Stage, level and applicability placements are proposals. None has been validated by legal/compliance yet.</div></div>
    ${group('Frequency text not recognized by the normalizer', otherFreq)}
  `;
}

/* ============================= DRAWER ============================= */
function deadlineSummary(it){
  const d = it.deadline_rule || {};
  if(d.type==='fixed') return {main: d.date ? fmtDate(d.date) : (d.text||'Fixed date'), note:'Fixed date from the master'};
  if(d.type==='rule') return {main: d.text || 'Rule-based', note:'Rule from the master'};
  if(d.type==='continuous') return {main:'Continuous obligation', note:'No single due date; applies throughout' + (d.text ? ' · source text: '+d.text : '')};
  const kind = {recurring:'Recurs '+(d.period||''), event:'Triggered by an event', one_time:'One-time obligation', unknown:'Timing not specified in the master'}[d.type] || '';
  return {main:'Deadline Pending Validation', note: kind + (d.text ? ' · source text: '+d.text : '')};
}
function stagePrereqHtml(it){
  const stage = S.stages.find(s=>s.id===effectiveStageId(it));
  const pre = ((stage&&stage.prerequisites)||[]).map(id=>S.stages.find(s=>s.id===id)).filter(Boolean);
  if(!pre.length) return '<div style="font-size:12.5px;color:var(--text-muted);">No earlier stage is proposed as a prerequisite.</div>';
  return pre.map(p=>{
    const c = stageStats(S.inst.filter(i=>effectiveStageId(i.item)===p.id));
    const txt = p.id==='S0' ? 'Set-up' : (c.applicable ? `${c.done} of ${c.applicable} completed in this view` : 'no records in this view');
    return `<div class="doc-check"><span class="st">${c.applicable&&c.done===c.applicable?'✓':'○'}</span><span style="flex:1">${esc(p.name)}</span><span style="color:var(--text-muted);font-size:11.5px;">${txt}</span></div>`;
  }).join('') + '<div style="font-size:11px;color:var(--text-muted);margin-top:6px;">Proposed sequence only. Item-by-item dependencies and blocking are not enforced yet.</div>';
}
function duplicatesHtml(it){
  if(!it.duplicate_group) return '';
  const others = S.items.filter(i=>i.duplicate_group===it.duplicate_group && i.compliance_id!==it.compliance_id);
  return `<div class="prose-meta"><b>Possible duplicates — ${esc(it.duplicate_group)}:</b> ${others.map(o=>`<a href="#" data-open="${esc(o.compliance_id)}" class="mono">${esc(o.compliance_id)}</a>`).join(', ')}. These records look like the same obligation; they are kept separate until a reviewer confirms.</div>`;
}

/** Find the instance for an instance key or a plain compliance ID; works from any screen. */
function instFromKey(key){
  const pk = Core.parseKey(key); if(!pk) return null;
  const sid = pk.scopeId;
  let ctx = null;
  if(S.companies[sid]) ctx = {companyId:sid};
  else if(S.projects[sid]) ctx = {projectId:sid};
  else if(S.phases[sid]) ctx = {projectId:S.phases[sid].project_id};
  else if(S.buildings[sid]) ctx = {projectId:S.buildings[sid].project_id};
  if(!ctx) return null;
  const found = Core.enumerate(worldData(), ctx).find(i=>i.key===key);
  return found ? decorateInst(found) : null;
}
function resolveInst(ref){
  if(S.instByKey[ref]) return S.instByKey[ref];
  if(Core.parseKey(ref)){ const f = instFromKey(ref); if(f) return f; }
  const item = S.itemById[ref];
  if(!item) return null;
  const match = S.inst.find(i=>i.item.compliance_id===ref);
  if(match) return match;
  const pseudo = {key:null, item, scopeType:Core.scopeTypeFor(item), scopeId:null, scopeLabel:'Not part of this view', readOnly:true};
  return decorateInst(pseudo);
}

function applicabilityPanel(inst){
  if(inst.readOnly) return `<section class="panel"><h4>Applicability</h4><div class="prose" style="font-size:12.5px">This record belongs to a ${esc(inst.scopeType)}-level scope that is not in the view you are looking at. Pick the company or project at the top to track it.</div></section>`;
  const d = inst.decision, can = canEditTracking();
  const cls = inst.state==='na' ? 'neutral' : inst.state==='review' ? 'hold' : 'ok';
  return `<section class="panel"><h4>Applicability — ${esc(inst.scopeLabel)}</h4>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;"><span class="badge ${cls}">${esc(inst.appStatus)}</span>
      <span class="chip">${d ? (d.source==='manual' ? 'Decided by '+esc(d.decided_by) : 'Decided by the rules') : 'Not evaluated yet'}</span></div>
    <div class="prose" style="font-size:12.5px">${esc(d ? d.reason : 'Not evaluated yet. Save the set-up for this company or project to evaluate it.')}</div>
    ${d && d.auto_suggestion ? `<div class="readonly-note" style="margin-top:8px;border-left:3px solid var(--warn)">The rules now suggest <b>${esc(d.auto_suggestion.status)}</b> (${esc(d.auto_suggestion.reason)}). The decision above was made by a person and has not been changed.</div>` : ''}
    ${can ? `<div class="field" style="margin-top:10px"><label>Change the decision</label><select id="appStatus">${Core.APPLICABILITY.map(s=>`<option ${s===inst.appStatus?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label>Reason (needed for Not Applicable and Legal Validation Required)</label><textarea id="appReason" rows="2"></textarea></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;"><button class="btn primary" id="appSave" type="button">Save decision</button>${d && d.source==='manual' ? '<button class="btn" id="appAuto" type="button">Back to automatic</button>' : ''}</div>` : ''}
    ${d && d.history && d.history.length ? `<details style="margin-top:10px"><summary style="cursor:pointer;font-size:12px;color:var(--text-muted)">History (${d.history.length})</summary>${d.history.slice().reverse().map(h=>`<div class="audit-entry"><b>${esc(h.by)}</b> — ${esc(h.from||'new')} → <b>${esc(h.to)}</b> (${esc(h.source)})<br>${new Date(h.at).toLocaleString()} · ${esc(h.reason||'')}</div>`).join('')}</details>` : ''}
  </section>`;
}

/** The risk level people have set for a record (it feeds the health score). The register itself carries none; a suggestion comes from its penalty wording. */
function riskControlHtml(it){
  const cur = (S.risk||{})[it.compliance_id], sug = ((S.riskProposals||{}).proposals||{})[it.compliance_id];
  const editable = can('decide_applicability');
  const label = cur ? `<b>${esc(LEVEL_TXT[cur.level])}</b> <span class="fact-sub">set by ${esc(cur.set_by||'')}${cur.source==='suggested'?' (accepted from the suggestion)':''}</span>` : '<span class="muted">Risk classification pending validation</span>';
  return `${label}
    ${sug&&!cur?`<div class="fact-sub">Suggested: <b>${esc(LEVEL_TXT[sug.level])}</b> — ${esc(sug.basis)} (not validated)</div>`:''}
    ${editable?`<div class="risk-edit"><select id="riskSel" title="Risk level for this record"><option value="">Choose…</option>${['critical','high','medium','low'].map(l=>`<option value="${l}" ${cur&&cur.level===l?'selected':''}>${LEVEL_TXT[l]}</option>`).join('')}</select><button class="btn sm" id="riskSave" type="button">Save</button>${sug&&!cur?`<button class="btn sm" id="riskUse" type="button">Use suggestion</button>`:''}</div>`:''}`;
}
async function saveRisk(cid, level){
  try{ await api('PUT', '/api/risk_overrides/'+encodeURIComponent(cid), {level}); S.risk = {...(S.risk||{}), [cid]:{level, set_by:ME.name, source:'manual'}}; toast('Risk level saved. The project scores will update.'); render(); if(currentDrawerItem) openDrawer(currentDrawerItem.key||currentDrawerItem.item.compliance_id); }
  catch(e){ toast(e.message); }
}

/** What this record waits for, and what waits for it. Shown only for records that have a proposed prerequisite link. */
function prereqPanel(inst){
  const id = inst.item.compliance_id;
  const edgesIn = S.deps.edges.filter(e=>e.to===id), edgesOut = S.deps.edges.filter(e=>e.from===id);
  if(!edgesIn.length && !edgesOut.length) return '';
  const short = x=>{ const it = S.itemById[x]; return it ? (it.brief_description||'').slice(0,70) : x; };
  const by = inst.blockedBy || [];
  const waiting = by.map(b=>{
    const p = S.itemById[b.id] || {};
    const act = String(p.action_required||'').replace(/\s+/g,' ').trim().slice(0,150);
    const sd = STATUS_DEFS[b.status] || STATUS_DEFS['Not Started'];
    return `<div class="setup-row clickable" style="align-items:flex-start;" data-open="${esc(b.key)}"><div style="flex:1;min-width:0">
        <div><span class="mono"><b>${esc(b.id)}</b></span>${b.scopeShort?' · '+esc(b.scopeShort):''} — ${esc(short(b.id))}</div>
        <div class="fact-sub">Owner: ${esc(p.owner||'—')} · Approver: ${esc(p.approver||'—')}</div>
        ${act?`<div class="fact-sub">Needed: ${esc(act)}${act.length>=150?'…':''}</div>`:''}
        ${b.basis?`<div class="fact-sub">Why: ${esc(b.basis)}</div>`:''}</div>
        <span class="badge ${sd.cls}">${esc(b.status)}</span></div>`;
  }).join('');
  const outs = edgesOut.map(e=>`<a href="#" data-open="${esc(e.to)}" class="mono">${esc(e.to)}</a>`).join(', ');
  return `<section class="panel"><h4>Prerequisites</h4>
    ${inst.status==='Compliant / Completed' ? '<div class="prose" style="font-size:12.5px;">This record is complete.</div>'
      : by.length ? `<div class="prose" style="font-size:12.5px;margin-bottom:6px;">Finish ${by.length===1?'this record':'these records'} first. It cannot be marked completed until then${can('override_completion')?' (a Compliance Manager or admin can override with a reason)':''}.</div>${waiting}`
      : edgesIn.length ? '<div class="prose" style="font-size:12.5px;"><span class="chip ok">Ready to start</span> Every prerequisite that applies is complete.</div>'
      : '<div class="prose" style="font-size:12.5px;">Nothing has to be completed before this record.</div>'}
    ${outs?`<div class="prose-meta"><b>Completing this unblocks:</b> ${outs}</div>`:''}
    <div class="fact-sub" style="margin-top:8px;">These prerequisites are proposed from the wording of the register and are not yet legally validated.</div>
  </section>`;
}

let currentDrawerItem = null, auditUnsub = null, docSel = '';
function openDrawer(ref){
  const inst = resolveInst(ref);
  if(!inst) return;
  const it = inst.item;
  currentDrawerItem = inst;
  docSel = '';
  const tr = inst.tr;
  const editable = canEditTracking() && !inst.readOnly && inst.state!=='na';
  const curStage = S.stages.find(s=>s.id===effectiveStageId(it));
  const currentStageName = curStage ? curStage.name : 'Unmapped to Stage';

  const st = STATUS_DEFS[inst.status] || STATUS_DEFS['Not Started'];
  const dl = deadlineSummary(it);
  const fact = (label, val, sub)=>`<div class="fact"><div class="fact-label">${label}</div><div class="fact-val">${val}</div>${sub?`<div class="fact-sub">${sub}</div>`:''}</div>`;
  const srcNote = (norm, raw)=> raw && raw!==norm ? 'Source: '+esc(raw) : '';
  const appCls = inst.state==='na' ? 'neutral' : inst.state==='review' ? 'hold' : 'ok';

  // ---- plain-language pieces ----
  const reasonText = inst.decision && inst.decision.reason ? inst.decision.reason : '';
  const banners = [];
  if(inst.readOnly) banners.push(['muted', 'This record is not part of the company or project you are looking at. Pick the matching one at the top to track it.']);
  else if(inst.state==='na') banners.push(['muted', `<b>Not applicable.</b> ${esc(reasonText)} Nothing to do here.`]);
  else if(inst.state==='review') banners.push(['hold', '<b>Not confirmed as applicable yet.</b> Open “Does this apply?” further down and decide.']);
  if(inst.blocked) banners.push(['hold', `<b>Blocked.</b> Finish ${inst.blockedBy.map(b=>`<span class="mono">${esc(b.id)}</span>${b.scopeShort?' ('+esc(b.scopeShort)+')':''}`).join(', ')} first.`]);
  else if(inst.ready) banners.push(['ok', '<b>Ready to start.</b> Everything it depends on is complete.']);
  if(inst.docs && (inst.docs.rejected || inst.docs.expired)) banners.push(['bad', '<b>A document needs attention.</b> One was rejected or has expired — see Documents.']);
  const bannerHtml = banners.map(b=>`<div class="banner ${b[0]}">${b[1]}</div>`).join('');

  const named = v=>{ const s = String(v||'').trim(); return s && !/^unassigned$/i.test(s) ? s : ''; };   // only show a person/team when one is actually named
  const owner = named(it.owner), approver = named(it.approver);
  const glance = (label, val)=>`<div><dt>${label}</dt><dd>${val}</dd></div>`;
  const shownStatus = inst.state==='na' ? ['neutral','—','Not applicable'] : [st.cls, st.ic, inst.status];
  const prereq = prereqPanel(inst);
  const prereqState = inst.status==='Compliant / Completed' ? '<span class="chip ok">Complete</span>' : inst.blocked ? '<span class="chip hold">Blocked</span>' : '<span class="chip ok">Ready</span>';

  document.getElementById('drawer').innerHTML = `
    <div class="modal-head">
      <div style="min-width:0;flex:1;">
        <div class="modal-badges">
          <span class="mono modal-id">${esc(it.compliance_id)}</span>
          <span class="badge neutral">${esc(it.department)}</span>
          ${inst.scopeShort?`<span class="badge neutral">${esc(inst.scopeShort)}</span>`:''}
          <span class="badge ${shownStatus[0]}"><span class="ic">${shownStatus[1]}</span>${esc(shownStatus[2])}</span>
        </div>
        <h3 class="modal-title" title="${esc(it.brief_description)}">${esc(it.brief_description)}</h3>
      </div>
      <button class="drawer-close" id="drawerClose" aria-label="Close">✕</button>
    </div>

    <div class="modal-body modal-stack">
      ${bannerHtml}

      <section class="panel">
        <h4>What needs to be done</h4>
        <div class="prose">${esc(it.action_required||'—')}</div>
      </section>

      ${owner||approver?`<section class="panel">
        <h4>Who is responsible</h4>
        <div class="who">
          ${owner?`<div><span class="who-label">Owner</span><span class="who-name">${esc(owner)}</span></div>`:''}
          ${approver?`<div><span class="who-label">Approver</span><span class="who-name">${esc(approver)}</span></div>`:''}
        </div>
      </section>`:''}

      ${it.penalty?`<section class="panel">
        <h4>If this is missed</h4>
        <div class="prose">${esc(it.penalty)}</div>
      </section>`:''}

      ${it.typical_timeline||it.typical_issues?`<section class="panel">
        <h4>What to expect</h4>
        ${it.typical_timeline?`<div class="prose"><b>Typical time:</b> ${esc(it.typical_timeline)}</div>`:''}
        ${it.typical_issues?`<div class="prose" style="margin-top:6px"><b>Common problems:</b> ${esc(it.typical_issues)}</div>`:''}
        ${it.source_track?`<div class="fact-sub" style="margin-top:6px">From the ${esc(it.source_track.toLowerCase())} checklist${it.source_checklist_row?' ('+esc(it.source_checklist_row)+')':''}.</div>`:''}
      </section>`:''}

      <details class="fold more">
        <summary><span>More details</span></summary>
        <div class="fold-body">
          <dl class="glance">
            ${it.regulation?glance('Law', `${esc(it.regulation)}${it.reference_section?(' — '+esc(it.reference_section)):''}`):''}
            ${glance('Authority', esc(it.authority_norm||'—'))}
            ${glance('How often', esc(it.frequency_norm||'—'))}
            ${glance('Deadline', `${esc(dl.main)}${dl.note?`<div class="fact-sub">${esc(dl.note)}</div>`:''}`)}
            ${glance('Your target date', tr.next_due_date?fmtDate(tr.next_due_date):'<span class="muted">Not set</span>')}
            ${glance('Applies to', esc(inst.scopeLabel))}
            ${it.applicability?glance('Who it applies to', esc(it.applicability)):''}
            ${glance('Stage', `${esc(currentStageName)}${it.stage_basis?`<div class="fact-sub">${esc(it.stage_basis)}</div>`:''}`)}
            ${glance('Level', esc(it.compliance_level||it.level||'—'))}
            ${it.trigger && it.trigger!==it.applicability?glance('Starts when', esc(it.trigger)):''}
            ${it.due_date_raw?glance('Due date in the register', esc(it.due_date_raw)):''}
            ${glance('Legal check', esc(it.legal_validation_status||'—'))}
            ${glance('Risk level', riskControlHtml(it))}
          </dl>
          ${duplicatesHtml(it)}
        </div>
      </details>

      <section class="panel">
        <h4>Documents</h4>
        <div id="docsBox" style="color:var(--text-muted); font-size:12px;">Loading…</div>
      </section>

      <div class="panel" id="trackPanel" ${docSel?'':'hidden'}>
        <h4 style="margin-bottom:10px;">Update status</h4>
        ${!canEditTracking()?'<div class="readonly-note">Your role can view this but not change it.</div>':''}
        ${inst.state==='na'?'<div class="readonly-note">Marked not applicable, so there is nothing to track.</div>':''}
        <div class="setup-grid">
          <div class="field"><label>Status</label>
            <select id="statusSelect" ${editable?'':'disabled'}>${STATUS_LIST.map(s=>`<option value="${s}" ${tr.status===s?'selected':''}>${s}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Next due date</label><input type="date" id="nextDueInput" value="${tr.next_due_date||''}" ${editable?'':'disabled'}></div>
        </div>
        <div class="field"><label>Remarks</label><textarea id="remarksInput" rows="2" ${editable?'':'disabled'}>${esc(tr.remarks||'')}</textarea></div>
        ${tr.evidence_link?`<div class="field"><label>Earlier evidence link</label><div class="val"><a href="${esc(tr.evidence_link)}" target="_blank" rel="noopener noreferrer">${esc(tr.evidence_link)}</a></div></div>`:''}
        <input type="hidden" id="whoInput" value="${esc(tr.last_updated_by || '')}">
        <button class="btn primary" id="saveTrackingBtn" ${editable?'':'disabled'}>Save status</button>
        ${tr.updated_at?`<div style="font-size:11px;color:var(--text-muted); margin-top:6px;">Last updated ${new Date(tr.updated_at).toLocaleString()}${tr.last_updated_by?' by '+esc(tr.last_updated_by):''}</div>`:''}
      </div>

      ${prereq?`<details class="fold" ${inst.blocked?'open':''}><summary><span>Prerequisites</span>${prereqState}</summary><div class="fold-body">${prereq}</div></details>`:''}

      <details class="fold" ${inst.state==='review'?'open':''}>
        <summary><span>Does this apply?</span><span class="badge ${appCls}">${esc(inst.appStatus)}</span></summary>
        <div class="fold-body">${applicabilityPanel(inst)}</div>
      </details>

      <details class="fold">
        <summary><span>History of changes</span></summary>
        <div class="fold-body"><div id="auditList" style="color:var(--text-muted); font-size:12px;">Loading…</div></div>
      </details>
    </div>
  `;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
  document.getElementById('drawerClose').onclick = closeDrawer;
  document.getElementById('drawer').querySelectorAll('[data-open]').forEach(a=>a.addEventListener('click', e=>{ e.preventDefault(); openDrawer(a.getAttribute('data-open')); }));

  const saveBtn = document.getElementById('saveTrackingBtn');
  if(saveBtn) saveBtn.onclick = ()=>{
    const status = document.getElementById('statusSelect').value, remarks = document.getElementById('remarksInput').value;
    if(status==='Not Applicable' && !remarks.trim()){ toast('Give the reason in Remarks, or use the Applicability decision above.'); return; }
    const patch = {status, next_due_date: document.getElementById('nextDueInput').value || null, remarks};
    (async ()=>{
      let res = await saveTracking(inst, patch);
      // The server refuses "completed" while documents are missing/unverified or a prerequisite is open.
      if(res && res.blocked && res.canOverride){
        const why = window.prompt(res.message+'\n\nIf you are sure, type the reason to complete it anyway. The reason is recorded on the record and in the audit trail.');
        if(why && why.trim()) res = await saveTracking(inst, {...patch, override_reason: why.trim()});
      } else if(res && res.blocked) toast(res.message, 9000);
      render();
    })();
  };
  const decide = async (status, reason)=>{
    try{
      await api('POST', '/api/applicability', {key:inst.key, status, reason});
      await reloadAll(['applicability']);
      toast(status==='auto' ? 'Back to automatic.' : 'Decision saved.');
      render(); openDrawer(inst.key);
    }catch(e){ toast(e.message); }
  };
  const rs = document.getElementById('riskSave');
  if(rs) rs.onclick = ()=>{ const v = document.getElementById('riskSel').value; if(!v){ toast('Choose a level.'); return; } saveRisk(it.compliance_id, v); };
  const ru = document.getElementById('riskUse');
  if(ru) ru.onclick = ()=>saveRisk(it.compliance_id, ((S.riskProposals||{}).proposals||{})[it.compliance_id].level);
  const appSave = document.getElementById('appSave');
  if(appSave) appSave.onclick = ()=>decide(document.getElementById('appStatus').value, document.getElementById('appReason').value);
  const appAuto = document.getElementById('appAuto');
  if(appAuto) appAuto.onclick = ()=>decide('auto', '');

  if(inst.key) loadDocs(inst); else { const b = document.getElementById('docsBox'); if(b) b.textContent = 'Documents are kept per company, project, phase or building. Choose the matching one at the top to upload.'; }

  if(auditUnsub) auditUnsub();
  auditUnsub = subscribeAudit(inst.key, entries=>{
    const el = document.getElementById('auditList');
    if(!el) return;
    el.innerHTML = entries.length ? entries.map(a=>`<div class="audit-entry"><b>${esc(a.who)}</b> — ${esc(a.old_status)} → <b>${esc(a.new_status)}</b><br>${new Date(a.at).toLocaleString()} ${a.remark?('· '+esc(a.remark)):''}</div>`).join('') : 'No status changes recorded yet.';
  });
}
/* ---------- Documents: versions, verification, expiry ---------- */
const OTHER_DOC = '__other__';
const requiredDocs = it=>Core.requiredDocs(it);
function fmtSize(n){ return n>=1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB'; }
/** File routes take a custom header instead of the usual JSON check. */
async function fileApi(method, url, body){
  const r = await fetch(url, {method, headers:{'Content-Type':'application/json','X-Requested-With':'fetch'}, body: JSON.stringify(body||{})});
  if(r.status===401){ location.href='/login.html'; throw new Error('not signed in'); }
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ const e = new Error(j.error || ('HTTP '+r.status)); e.status = r.status; throw e; }
  return j;
}

async function loadDocs(inst){
  let docs = [];
  try{ docs = (await api('GET', '/api/documents?key='+encodeURIComponent(inst.key))).map(d=>({id:d.id, ...d.data})); }
  catch(e){ const b=document.getElementById('docsBox'); if(b) b.textContent='Could not load documents: '+e.message; return; }
  S.docsByKey[inst.key] = docs;
  if(!currentDrawerItem || currentDrawerItem.key !== inst.key) return;
  renderDocsBox(inst, docs);
}

function docStatusChip(d){
  if(d.status==='Rejected') return '<span class="chip bad">Rejected</span>';
  if(d.expiry_date && d.expiry_date < todayISO()) return '<span class="chip bad">Expired</span>';
  if(d.status==='Verified') return '<span class="chip ok">Verified</span>';
  return '<span class="chip warn">Awaiting verification</span>';
}
function docMeta(d){
  const bits = [esc(d.file_name), fmtSize(d.size), 'uploaded by '+esc(d.uploaded_by), new Date(d.uploaded_at).toLocaleDateString('en-IN')];
  if(d.issue_date) bits.push('issued '+fmtDate(d.issue_date));
  if(d.expiry_date) bits.push('expires '+fmtDate(d.expiry_date));
  let v = '';
  if(d.verified_by) v = `<div class="meta">${d.status==='Rejected'?'Rejected':'Verified'} by ${esc(d.verified_by)} on ${new Date(d.verified_at).toLocaleDateString('en-IN')}${d.verification_note?' — '+esc(d.verification_note):''}</div>`;
  return `<div class="meta">${bits.join(' · ')}</div>${v}`;
}

function renderDocsBox(inst, docs){
  const it = inst.item;
  const box = document.getElementById('docsBox');
  if(!box) return;
  const editable = can('upload_docs') && inst.state!=='na' && !inst.readOnly;
  const canVerify = can('verify_docs') && !inst.readOnly;
  const req = requiredDocs(it);
  const cur = Core.currentDocs(docs);                       // latest version of each named document
  const verifiedCount = req.filter(n=>{ const d = cur.get(n.toLowerCase()); return d && d.status==='Verified' && !(d.expiry_date && d.expiry_date < todayISO()); }).length;
  box.style.color = '';

  // group every uploaded file by document name, newest version first
  const groups = new Map();
  docs.forEach(d=>{ const k = String(d.doc_name).toLowerCase(); (groups.get(k) || groups.set(k, []).get(k)).push(d); });
  groups.forEach(list=>list.sort((a,b)=>(b.version||1)-(a.version||1)));

  const reqRow = n=>{
    const d = cur.get(n.toLowerCase());
    const prep = Core.docOrigin(n)==='prepared';
    const canPrepare = prep && editable && typeof openPrepare==='function';
    return `<div class="doc-check ${d&&d.status==='Verified'?'done':'pending'}" style="flex-wrap:wrap"><span class="st">${d&&d.status==='Verified'?'✓':'○'}</span><span style="flex:1;min-width:140px">${esc(n)} <span class="chip" title="${prep?'The company writes this document, so it can be prepared here from a format.':'Issued by an authority or another party. Upload the copy you receive.'}" style="font-size:10.5px">${prep?'Prepared by us':'Received'}</span>${d&&d.carried_from_id?`<div class="meta">Added automatically from ${esc(d.carried_from_id)}</div>`:''}</span>${d?docStatusChip(d):'<span style="color:var(--text-muted);font-size:11.5px;">Not uploaded</span>'}${canPrepare?`<button class="btn sm" data-prepare="${esc(n)}" type="button">${d?'Prepare new version':'Prepare'}</button>`:''}</div>`;
  };
  const fileRow = (d, isCurrent)=>{
    const own = d.uploaded_by_email === ME.email && ME.role !== 'admin';
    const pending = isCurrent && d.status !== 'Verified' && d.status !== 'Rejected';
    return `<div class="doc-file" style="align-items:flex-start;">
      <div style="min-width:0"><div><b>${esc(d.doc_name)}</b> <span class="chip">v${d.version||1}</span> ${isCurrent?docStatusChip(d):'<span class="chip">Replaced</span>'}</div>${docMeta(d)}
        ${canVerify && pending ? `<div class="doc-actions">${own ? '<span class="fact-sub">Another person must verify this upload.</span>' : `<button class="btn sm primary" data-verify="${esc(d.id)}" type="button">Verify</button><button class="btn sm" data-reject="${esc(d.id)}" type="button">Reject</button>`}</div>` : ''}
      </div>
      <div style="white-space:nowrap"><a class="btn sm" href="/files/${esc(d.file_id)}" style="text-decoration:none;display:inline-block;">Download</a>
        ${editable && isCurrent ? `<button class="btn sm" data-docdel="${esc(d.id)}" type="button">Delete</button>` : ''}</div></div>`;
  };

  box.innerHTML = `
    ${req.length ? `<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">${verifiedCount} of ${req.length} required documents verified${inst.scopeType==='company'?' · shared by every project of this company':''}</div>
    <div>${req.map(reqRow).join('')}</div>`
    : '<div style="font-size:12px;color:var(--text-muted);">No specific documents are listed for this item. Use "Other document" to upload one.</div>'}
    <div class="field" style="margin-top:12px;"><label>Select a document</label>
      <select id="docSelect"><option value="">— Choose a document —</option>${req.map(n=>`<option value="${esc(n)}" ${docSel===n?'selected':''}>${esc(n)}${cur.get(n.toLowerCase())?' (upload new version)':''}</option>`).join('')}<option value="${OTHER_DOC}" ${docSel===OTHER_DOC?'selected':''}>Other document…</option></select>
    </div>
    ${editable?`<div id="docUploadRow" ${docSel?'':'hidden'}>
      <input type="text" id="docOther" placeholder="Document name" style="margin-bottom:8px;" ${docSel===OTHER_DOC?'':'hidden'}>
      <div class="doc-upload" style="margin-top:0;"><input type="file" id="docFile" accept=".pdf,.doc,.docx"></div>
      <div class="setup-grid" style="margin-top:8px;">
        <div class="field" style="margin-bottom:6px;"><label>Issue date (optional)</label><input type="date" id="docIssue"></div>
        <div class="field" style="margin-bottom:6px;"><label>Expiry date (optional)</label><input type="date" id="docExpiry"></div>
      </div>
      <button class="btn primary" id="docUploadBtn" type="button">Upload</button>
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">PDF or Word (.doc, .docx) · max 15 MB · uploading the same document again saves a new version and keeps the old one.</div>
    </div>`:`<div class="readonly-note">${inst.state==='na'?'Marked not applicable, so uploads are switched off.':'Your current role cannot upload documents.'}</div>`}
    <div id="trackHint" class="prose-meta" style="margin-top:12px;" ${docSel?'hidden':''}>Select a document above to upload it and update the tracking status.</div>
    <div style="margin-top:14px;">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);margin-bottom:4px;">Uploaded documents (${groups.size})</div>
      ${groups.size ? [...groups.values()].map(list=>{
        const [latest, ...older] = list;
        return `<div class="doc-vgroup">${fileRow(latest, !latest.superseded)}${older.length?`<details style="margin-top:4px;"><summary style="cursor:pointer;font-size:11.5px;color:var(--text-muted);">Earlier versions (${older.length})</summary>${older.map(o=>fileRow(o,false)).join('')}</details>`:''}</div>`;
      }).join('') : '<div style="font-size:12px;color:var(--text-muted);">Nothing uploaded yet.</div>'}
    </div>`;

  const sel = document.getElementById('docSelect');
  const other = document.getElementById('docOther');
  sel.onchange = ()=>{
    docSel = sel.value;
    document.getElementById('trackPanel').hidden = !docSel;
    document.getElementById('trackHint').hidden = !!docSel;
    const row = document.getElementById('docUploadRow');
    if(row){ row.hidden = !docSel; other.hidden = docSel!==OTHER_DOC; }
  };
  const refresh = async ()=>{ await loadDocs(inst); render(); loadNotes(); };
  box.querySelectorAll('[data-prepare]').forEach(b=>b.onclick = ()=>openPrepare(inst, b.dataset.prepare));
  if(editable){
    document.getElementById('docUploadBtn').onclick = async ()=>{
      const file = document.getElementById('docFile').files[0];
      const name = sel.value===OTHER_DOC ? other.value.trim() : sel.value;
      if(!name){ toast(sel.value===OTHER_DOC ? 'Enter a document name.' : 'Select a document.'); return; }
      if(!file){ toast('Choose a file to upload.'); return; }
      if(file.size > 15*1024*1024){ toast('File is larger than 15 MB.'); return; }
      const issue = document.getElementById('docIssue').value, expiry = document.getElementById('docExpiry').value;
      if(issue && expiry && expiry < issue){ toast('The expiry date is before the issue date.'); return; }
      const btn = document.getElementById('docUploadBtn'); btn.disabled = true; btn.textContent = 'Uploading…';
      try{
        const q = new URLSearchParams({key: inst.key, compliance_id: it.compliance_id, project_id: inst.projectId||'', doc_name: name, file_name: file.name});
        if(issue) q.set('issue_date', issue); if(expiry) q.set('expiry_date', expiry);
        const r = await fetch('/files?'+q, {method:'POST', headers:{'Content-Type':'application/octet-stream','X-Requested-With':'fetch'}, body:file});
        if(r.status===401){ location.href='/login.html'; return; }
        const j = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(j.error || ('HTTP '+r.status));
        toast(j.version>1 ? `Saved as version ${j.version}. It needs verifying.` : 'Document uploaded. It needs verifying.');
      }catch(e){ toast('Upload failed: '+e.message); }
      refresh();
    };
  }
  box.querySelectorAll('[data-verify]').forEach(b=>b.onclick = async ()=>{
    try{ await fileApi('POST', `/files/${encodeURIComponent(b.dataset.verify)}/verify`, {status:'Verified'}); toast('Verified.'); }catch(e){ toast(e.message); }
    refresh();
  });
  box.querySelectorAll('[data-reject]').forEach(b=>b.onclick = async ()=>{
    const note = window.prompt('Why is this document rejected? (required — the uploader will see it)');
    if(!note || !note.trim()) return;
    try{ await fileApi('POST', `/files/${encodeURIComponent(b.dataset.reject)}/verify`, {status:'Rejected', note:note.trim()}); toast('Rejected. The uploader has been notified.'); }catch(e){ toast(e.message); }
    refresh();
  });
  box.querySelectorAll('[data-docdel]').forEach(b=>b.onclick = async ()=>{
    if(!window.confirm('Delete this uploaded file?')) return;
    try{ await fileApi('DELETE', '/files/'+encodeURIComponent(b.dataset.docdel)); toast('Deleted.'); }catch(e){ toast('Delete failed: '+e.message); }
    refresh();
  });
}

function attachViewHandlers(){
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=>openDrawer(el.getAttribute('data-open')));
  });
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const block = el.closest('.stage-block');
      block.classList.toggle('open');
      const sid = block.getAttribute('data-stage');
      if(block.classList.contains('open')) OPEN_STAGES.add(sid); else OPEN_STAGES.delete(sid);
    });
  });
  if(S.view==='dashboard') attachIntelHandlers();
  if(S.view==='regulatory') attachRegulatoryHandlers();
  if(S.view==='documents' && typeof attachDocumentsHandlers==='function') attachDocumentsHandlers();
  if(S.view==='vault' && typeof attachVaultHandlers==='function') attachVaultHandlers();
  if(S.view==='stages'){
    document.querySelectorAll('[data-sf]').forEach(el=>el.addEventListener('change', ()=>{ SF[el.dataset.sf] = el.value; render(); }));
    const clr = document.getElementById('sfClear');
    if(clr) clr.onclick = ()=>{ Object.keys(SF).forEach(k=>SF[k]=''); render(); };
  }
  if(S.view==='calendar'){
    attachUndated();
    document.getElementById('calPrev').onclick = ()=>{ S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth()-1, 1); render(); };
    document.getElementById('calNext').onclick = ()=>{ S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth()+1, 1); render(); };
    document.getElementById('calToday').onclick = ()=>{ S.calMonth = new Date(); render(); };
    document.getElementById('icsExport').onclick = async ()=>{
      const ics = buildICS();
      download('compliance-calendar.ics', ics, 'text/calendar');
    };
  }
  if(S.view==='register'){
    refreshRegisterBody();
    ['regSearch','regDept','regLevel','regApp'].forEach(id=>document.getElementById(id).addEventListener('input', refreshRegisterBody));
    document.querySelectorAll('[data-col]').forEach(cb=>cb.addEventListener('change', ()=>{
      const col = cb.getAttribute('data-col');
      if(cb.checked){ if(!S.registerCols.includes(col)) S.registerCols.push(col); }
      else S.registerCols = S.registerCols.filter(c=>c!==col);
      render();
    }));
    document.getElementById('regExport').onclick = async ()=>{
      const rows = window._regRows||[];
      const header = S.registerCols.map(c=>ALL_COLS.find(x=>x[0]===c)[1]);
      const csv = [header.join(',')].concat(rows.map(it=>S.registerCols.map(c=>{
        const v = String(regRowValue(it,c)||'').replace(/"/g,'""');
        return `"${v}"`;
      }).join(','))).join('\r\n');
      download('compliance-register.csv', ''+csv, 'text/csv;charset=utf-8');
    };
  }
  if(S.view==='users') attachUserHandlers();
  if(S.view==='settings') attachSettingsHandlers();
  document.querySelectorAll('[data-setup]').forEach(el=>el.addEventListener('click', e=>{ e.preventDefault(); const [k,id] = el.dataset.setup.split(':'); if(id) openSetup(k,id); }));
  if(S.view==='projects'){
    const main = document.getElementById('main');
    if(!main._segWired){ main._segWired = true; wireSegments(main); }
    document.querySelectorAll('[data-viewproj]').forEach(el=>el.addEventListener('click', ()=>{ setCtx('p:'+el.dataset.viewproj); populateProjectSelect(); switchView('stages'); }));
    const find = document.getElementById('projFind');
    if(find) find.addEventListener('input', ()=>{
      const q = find.value.toLowerCase().trim();
      document.querySelectorAll('.prow').forEach(r=>{ r.hidden = q && !r.dataset.name.includes(q); });
    });
    const toggle = document.getElementById('toggleAdd');
    if(toggle) toggle.onclick = ()=>{ const c = document.getElementById('addProjectCard'); c.hidden = !c.hidden; if(!c.hidden) document.getElementById('npName').focus(); };
    const npSave = document.getElementById('npSave');
    if(npSave) npSave.onclick = async ()=>{
      const name = document.getElementById('npName').value.trim();
      const companyId = theCompanyId();
      if(!name){ toast('Enter a project name.'); return; }
      if(!companyId){ toast('No company is set up.'); return; }
      if(Object.values(S.projects).some(p=>p.name.toLowerCase().trim()===name.toLowerCase())){ toast('A project with this name already exists.'); return; }
      const cat = document.getElementById('npCat').dataset.val || 'real_estate';
      npSave.disabled = true;
      try{
        const id = 'proj_'+slug(name)+'_'+uid(), now = new Date().toISOString();
        const doc = {name, company_id:companyId, category:cat, location:document.getElementById('npLocation').value.trim(), facts:{}, created_at:now};
        if(cat==='real_estate'){ doc.rera_no = document.getElementById('npRera').value.trim(); doc.project_type = document.getElementById('npType').value; doc.current_stage = ''; }
        await db.doc('projects/'+id).set(doc);
        if(cat==='real_estate') await db.doc('phases/ph_'+id.replace(/^proj_/,'')+'_1').set({project_id:id, name:'Phase 1', rera_no:doc.rera_no||'', created_at:now});
        await reloadAll(['projects','phases']);
        const s = await regenerate({projectId:id});
        setCtx('p:'+id); populateProjectSelect();
        toast('Project added. '+summaryText(s)); render(); openProjectSetup(id);
      }catch(e){ toast('Could not add the project: '+e.message); npSave.disabled = false; }
    };
  }
}

function openAccessModal(email){
  const u = (S.users||[]).find(x=>x.email===email); if(!u) return;
  const all = !u.project_ids;
  const ids = Object.keys(S.projects);
  const cats = [['real_estate','Real estate projects'],['epc','EPC projects']];
  const d = showModal(`
    <div class="modal-head"><div style="flex:1"><div class="modal-badges"><span class="modal-id mono">Project access</span></div><h3 class="modal-title">${esc(u.name)} · ${esc(roleLabel(u.role))}</h3></div><button class="drawer-close" id="drawerClose" aria-label="Close">✕</button></div>
    <div class="modal-body">
      <section class="step">
        <label style="display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;"><input type="checkbox" id="accAll" ${all?'checked':''}> Can see every project</label>
        <p class="step-desc" style="margin-left:0;">Untick to choose the projects this person can see and work on. Company-wide records stay visible to everyone but can only be changed by unrestricted accounts.</p>
        <div id="accList" style="${all?'opacity:.45;pointer-events:none;':''}">
          ${cats.map(([cat,label])=>{ const list = ids.filter(id=>categoryOf(S.projects[id])===cat).sort((a,b)=>S.projects[a].name.localeCompare(S.projects[b].name)); return list.length?`<div class="q-group"><h5>${label}</h5>${list.map(id=>`<label style="display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px;"><input type="checkbox" data-acc="${esc(id)}" ${(u.project_ids||[]).includes(id)?'checked':''}> ${esc(S.projects[id].name)}</label>`).join('')}</div>`:''; }).join('')}
        </div>
      </section>
    </div>
    <div class="modal-foot"><button class="btn primary" id="accSave" type="button">Save access</button></div>`);
  d.querySelector('#accAll').onchange = e=>{ const l = d.querySelector('#accList'); l.style.opacity = e.target.checked?'.45':''; l.style.pointerEvents = e.target.checked?'none':''; };
  d.querySelector('#accSave').onclick = async ()=>{
    const allOn = d.querySelector('#accAll').checked;
    const chosen = [...d.querySelectorAll('[data-acc]')].filter(c=>c.checked).map(c=>c.dataset.acc);
    if(!allOn && !chosen.length){ toast('Choose at least one project, or allow all.'); return; }
    try{ await api('PUT', '/auth/users/'+encodeURIComponent(email), {project_ids: allOn ? null : chosen}); toast('Access saved. They are signed out so it takes effect.'); closeDrawer(); loadUsers(); }
    catch(e){ toast(e.message); }
  };
}

function attachUserHandlers(){
  document.querySelectorAll('[data-urole]').forEach(el=>el.addEventListener('change', async ()=>{
    try{ await api('PUT', '/auth/users/'+encodeURIComponent(el.dataset.urole), {role: el.value}); toast('Role updated.'); }
    catch(e){ toast(e.message); }
    loadUsers();
  }));
  document.querySelectorAll('[data-uaccess]').forEach(el=>el.addEventListener('click', ()=>openAccessModal(el.dataset.uaccess)));
  document.querySelectorAll('[data-uactive]').forEach(el=>el.addEventListener('click', async ()=>{
    try{ await api('PUT', '/auth/users/'+encodeURIComponent(el.dataset.uactive), {active: el.dataset.to==='1'}); toast('Updated.'); }
    catch(e){ toast(e.message); }
    loadUsers();
  }));
  document.querySelectorAll('[data-upw]').forEach(el=>el.addEventListener('click', async ()=>{

    if(!pw) return;
    try{ await api('PUT', '/auth/users/'+encodeURIComponent(el.dataset.upw), {password: pw}); toast('Password reset. They are signed out everywhere.'); }
    catch(e){ toast(e.message); }
  }));

  if(save) save.onclick = async ()=>{
    try{
      await api('POST', '/auth/users', {
        name: document.getElementById('nuName').value, email: document.getElementById('nuEmail').value,

const DEFAULT_REMINDERS = {enabled:true, days:[30,15,7,3,1,0], overdue_days:[1,7,14,30]};
const reminderRules = ()=>({...DEFAULT_REMINDERS, ...((S.settingsMap||{}).reminders||{})});

/* ---------- risk classification + health-score settings ---------- */
const DEFAULT_HEALTH_UI = {weights:{critical:10,high:7,medium:4,low:1}, unclassified_level:'medium',
  factors:{completed_verified:0, completed_unverified:0.5, in_progress:0.5, submitted:0.5, not_started:1, overdue:1, blocked:1, on_hold:1},
  deductions:{critical_overdue:3, expired_document:2, missing_documents:1.5, blocked_statutory:1.5}, deduction_caps:{critical_overdue:15, expired_document:10, missing_documents:10, blocked_statutory:10},
  bands:{healthy:90, good:75, attention:60, at_risk:40}, due_soon_days:30, ai_auto_refresh:false, ai_refresh_hours:24};
const healthSettings = ()=>{ const s = (S.settingsMap||{}).health||{}, d = DEFAULT_HEALTH_UI; const m = k=>({...d[k], ...(s[k]||{})}); return {...d, ...s, weights:m('weights'), factors:m('factors'), deductions:m('deductions'), deduction_caps:m('deduction_caps'), bands:m('bands')}; };
const FACTOR_TXT = {completed_verified:'Completed and verified', completed_unverified:'Completed, documents not all verified', in_progress:'In progress', submitted:'Submitted / under review', not_started:'Not started', overdue:'Overdue', blocked:'Blocked', on_hold:'On hold'};
const DEDUCT_TXT = {critical_overdue:'Critical obligation overdue', expired_document:'Required document expired', missing_documents:'Required document missing near a deadline', blocked_statutory:'Critical / high obligation blocked'};

function riskClassificationHtml(){
  if(!can('decide_applicability')) return '';
  const total = S.items.length, set = Object.keys(S.risk||{}).length;
  const props = (S.riskProposals||{}).proposals||{}, avail = Object.keys(props).filter(c=>!(S.risk||{})[c]);
  const by = {critical:0, high:0, medium:0}; avail.forEach(c=>by[props[c].level]++);
  return `<div class="card" style="max-width:640px; margin-bottom:18px;">
    <h3 style="margin-bottom:4px;">Risk classification</h3>
    <div style="color:var(--text-muted);font-size:12.5px;margin-bottom:12px;">The health score weights each record by how serious it is. The register does not carry a risk level, so a person must set one. Until then a record is scored at the “${esc(healthSettings().unclassified_level)}” weight and flagged <b>Risk classification pending validation</b>.</div>
    <div class="h-tiles" style="margin:0 0 12px;"><div class="h-tile"><b>${set}</b><span>Classified by a person</span></div><div class="h-tile"><b>${total-set}</b><span>Still pending</span></div><div class="h-tile"><b>${avail.length}</b><span>Have a suggestion</span></div></div>
    <div class="fact-sub" style="margin-bottom:10px;">Suggestions are read from each record’s own penalty wording: <b>${by.critical}</b> critical (prosecution plus stop-work/revocation), <b>${by.high}</b> high (prosecution, imprisonment, stop-work, closure or revocation), <b>${by.medium}</b> medium (fine or penalty only). Records with no penalty text get no suggestion. They are not legal classifications.</div>
    <button class="btn primary" id="riskAccept" type="button" ${avail.length?'':'disabled'}>Accept the ${avail.length} suggestions</button>
    <div class="fact-sub" style="margin-top:8px;">You can still change any record afterwards from its “More details”. A level you set yourself is never overwritten by a suggestion.</div></div>`;
}
function healthSettingsHtml(){
  const s = healthSettings(), can_ = can('manage_settings');
  const num = (id,v,step='any')=>`<input type="number" step="${step}" id="${id}" value="${esc(v)}" ${can_?'':'disabled'}>`;
  const group = (title,desc,rows)=>`<div style="margin-top:14px;"><div class="ai-l">${title}</div>${desc?`<div class="fact-sub" style="margin:2px 0 6px;">${desc}</div>`:''}<div class="setup-grid">${rows}</div></div>`;
  const f = (label,html)=>`<div class="field"><label style="text-transform:none;letter-spacing:0;font-size:12px;color:var(--text)">${label}</label>${html}</div>`;
  return `<div class="card" style="max-width:760px; margin-bottom:18px;"><h3 style="margin-bottom:4px;">Compliance health score</h3>
    <div style="color:var(--text-muted);font-size:12.5px;">These starting values are suggestions, not legal classifications. Change them to match how your team judges risk. The score is recalculated for every project afterwards.</div>
    ${can_?'':'<div class="readonly-note" style="margin-top:8px;">Only a Company Admin or Master Admin can change these.</div>'}
    ${group('Risk weights','Points per record, by risk level.', ['critical','high','medium','low'].map(k=>f(LEVEL_TXT[k], num('hw_'+k, s.weights[k]))).join('') + f('Weight for records nobody has classified', `<select id="hw_unc" ${can_?'':'disabled'}>${['critical','high','medium','low'].map(l=>`<option value="${l}" ${s.unclassified_level===l?'selected':''}>${LEVEL_TXT[l]}</option>`).join('')}</select>`))}
    ${group('Outstanding-risk factor','How much of a record’s weight still counts as outstanding, by status (0 = nothing, 1 = all of it). In progress is not treated as half done unless you set it that way.', Object.keys(FACTOR_TXT).map(k=>f(FACTOR_TXT[k], num('hf_'+k, s.factors[k]))).join(''))}
    ${group('Extra deductions','Points taken off the score for serious problems. One record can cause at most one deduction; each kind has a cap.', Object.keys(DEDUCT_TXT).map(k=>f(DEDUCT_TXT[k]+' — points each', num('hd_'+k, s.deductions[k]))+f(DEDUCT_TXT[k]+' — cap', num('hc_'+k, s.deduction_caps[k]))).join(''))}
    ${group('Score bands','Lowest score for each band.', [['healthy','Healthy from'],['good','Good from'],['attention','Attention Required from'],['at_risk','At Risk from']].map(([k,l])=>f(l, num('hb_'+k, s.bands[k]))).join('') + f('“Due soon” means within (days)', num('hs_due', s.due_soon_days, '1')))}

function mdToHtml(src){
  const inline = s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  const isTbl = l=>/^\s*\|.*\|\s*$/.test(l), isUl = l=>/^\s*[-*•]\s+/.test(l), isOl = l=>/^\s*\d+[.)]\s+/.test(l), isH = l=>/^#{1,4}\s/.test(l);
  const cells = l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  const lines = String(src).split('\n'); const out = []; let i = 0;
  while(i<lines.length){
    const ln = lines[i];
    if(isTbl(ln) && i+1<lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
      const head = cells(ln); i += 2; const body = [];
      while(i<lines.length && isTbl(lines[i])) body.push(cells(lines[i++]));
      out.push(`<div class="md-table"><table><thead><tr>${head.map(h=>`<th>${inline(h)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
    } else if(isH(ln)){ out.push(`<h5>${inline(ln.replace(/^#{1,4}\s+/,''))}</h5>`); i++; }
    else if(isUl(ln)){ const li=[]; while(i<lines.length && isUl(lines[i])) li.push(`<li>${inline(lines[i++].replace(/^\s*[-*•]\s+/,''))}</li>`); out.push(`<ul>${li.join('')}</ul>`); }
    else if(isOl(ln)){ const li=[]; while(i<lines.length && isOl(lines[i])) li.push(`<li>${inline(lines[i++].replace(/^\s*\d+[.)]\s+/,''))}</li>`); out.push(`<ol>${li.join('')}</ol>`); }
    else if(!ln.trim()){ i++; }
    else { const p=[ln]; i++; while(i<lines.length && lines[i].trim() && !isTbl(lines[i]) && !isUl(lines[i]) && !isOl(lines[i]) && !isH(lines[i])) p.push(lines[i++]); out.push(`<p>${p.map(inline).join('<br>')}</p>`); }
  }
  return out.join('');
}

async function aiAsk(text){
  text = String(text||'').trim();
  if(!text || AI.busy) return;
  AI.err = null; AI.busy = true;
  AI.msgs.push({role:'user', content:text}); aiSave(); aiRender();
  document.getElementById('aiSend').disabled = true;
  try{
    const r = await api('POST', '/api/chat', {messages: AI.msgs.map(m=>({role:m.role, content:m.content}))});
    AI.msgs.push({role:'assistant', content:r.answer, sources:r.sources, id:r.id});
  }catch(e){
    AI.msgs.pop();                                    // drop the unanswered question and hand it back to the input box
    AI.err = e.message || 'Something went wrong.';
    const inp = document.getElementById('aiInput'); if(!inp.value) inp.value = text;
  }
  AI.busy = false; aiSave(); aiRender();
  document.getElementById('aiSend').disabled = false;
  document.getElementById('aiInput').focus();
}

async function loadIntel(quiet){
  const key = intelKey(); if(!key) return;
  const I = S.intel; I.key = key; I.loading = true; I.pending = false; I.error = null;
  if(!quiet && S.view==='dashboard') render();

  try{

      const tq = I.from||I.to ? `from=${I.from||''}&to=${I.to||''}` : `days=${I.days}`;
      const [data, recs, analysis, trend] = await Promise.all([api('GET', base+'/compliance-health'), api('GET', base+'/ai-recommendations?status=all'), api('GET', base+'/ai-analysis'), api('GET', base+'/compliance-health/trend?'+tq)]);
      if(intelKey()!==key) return;                     // the user switched view while this was loading
      Object.assign(I, {data, recs, analysis, trend});
    }
    I.loadedFor = key; I.sig = dataSig();
  }catch(e){ I.error = e.message || 'Could not load the project intelligence.'; I.loadedFor = key; }

  if(S.view==='dashboard'){ render(); window.scrollTo(0, y); }

function ensureIntel(){

}

  return {lines:[

    ['Recommended action', act ? act.recommended_action : 'No urgent action is needed right now.'],
  ]};
}

/* ---------- trend ---------- */
function lineChart(points, series, opts){
  const W = 360, H = 120, pad = {l:30,r:8,t:8,b:20};
  if(points.length<2) return '';
  const xs = i=>pad.l + (W-pad.l-pad.r) * (points.length===1?0:i/(points.length-1));
  const all = series.flatMap(s=>points.map(p=>s.f(p))), min = opts.min!=null?opts.min:Math.min(0,...all), max = opts.max!=null?opts.max:Math.max(1,...all);
  const ys = v=>pad.t + (H-pad.t-pad.b) * (1-(v-min)/((max-min)||1));
  const paths = series.map(s=>`<polyline fill="none" stroke="${s.color}" stroke-width="2" points="${points.map((p,i)=>xs(i).toFixed(1)+','+ys(s.f(p)).toFixed(1)).join(' ')}"/>`+points.map((p,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(s.f(p)).toFixed(1)}" r="2.2" fill="${s.color}"><title>${esc(p.date)}: ${s.f(p)}</title></circle>`).join('')).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart"><line x1="${pad.l}" y1="${ys(min)}" x2="${W-pad.r}" y2="${ys(min)}" stroke="var(--border)"/><line x1="${pad.l}" y1="${ys(max)}" x2="${W-pad.r}" y2="${ys(max)}" stroke="var(--border)" stroke-dasharray="3 3"/>
    <text x="2" y="${ys(max)+4}" class="ax">${max}</text><text x="2" y="${ys(min)+4}" class="ax">${min}</text>
    <text x="${pad.l}" y="${H-5}" class="ax">${esc(fmtDate(points[0].date))}</text><text x="${W-pad.r}" y="${H-5}" text-anchor="end" class="ax">${esc(fmtDate(points[points.length-1].date))}</text>${paths}</svg>`;
}
function trendHtml(d){
  const I = S.intel, pts = (I.trend && I.trend.points) || [];
  const rangeBtn = n=>`<button class="tabbtn ${!I.from&&!I.to&&I.days===n?'on':''}" data-trendday="${n}" type="button">${n} days</button>`;

      <div class="chart-card"><div class="ch-t">Health score</div>${lineChart(pts,[{f:p=>p.score,color:'var(--accent)'}],{min:0,max:100})}</div>
      <div class="chart-card"><div class="ch-t">Overdue <span class="dot" style="background:var(--bad)"></span> and critical <span class="dot" style="background:var(--hold)"></span></div>${lineChart(pts,[{f:p=>p.counts.overdue,color:'var(--bad)'},{f:p=>p.counts.critical,color:'var(--hold)'}],{min:0})}</div>
      <div class="chart-card"><div class="ch-t">Completed obligations</div>${lineChart(pts,[{f:p=>p.counts.completed,color:'var(--ok)'}],{min:0})}</div>

    : `<div class="empty-state" style="padding:24px;">${esc((I.trend&&I.trend.note)||'Historical compliance health data is not available yet.')}<div class="fact-sub" style="margin-top:6px;">Score snapshots are saved automatically from the day this feature was switched on. ${pts.length?'1 snapshot so far ('+esc(fmtDate(pts[0].date))+').':''}</div></div>`;

/* ---------- score explanation ---------- */
function openCalc(){
  const d = S.intel.data; if(!d) return; const h = d.health, u = h.settingsUsed;
  const row = (a,b)=>`<tr><td>${a}</td><td class="mono">${b}</td></tr>`;
  const incl = h.included.slice().sort((a,b)=>b.outstanding-a.outstanding);
  showModal(`<div class="modal-head"><div style="flex:1"><div class="modal-badges"><span class="modal-id mono">Score calculation</span></div><h3 class="modal-title">${esc(h.scope.name)} — ${h.score==null?'no score':h.score+' / 100 · '+esc(h.category)}</h3></div><button class="drawer-close" id="drawerClose" aria-label="Close">✕</button></div>
  <div class="modal-body modal-stack">
    <section class="panel"><h4>How the score is worked out</h4>
      <div class="prose" style="font-size:13.5px;"><ol style="margin:0 0 0 18px;padding:0;line-height:1.7;">
        <li>Every <b>applicable</b> record gets a <b>risk weight</b> from its classification (Critical ${u.weights.critical}, High ${u.weights.high}, Medium ${u.weights.medium}, Low ${u.weights.low}). Unclassified records use the “${esc(u.unclassified_level)}” weight.</li>
        <li>Each record’s <b>outstanding risk</b> = weight × a factor for its status (below). Completed and verified = 0.</li>
        <li><b>Risk percentage</b> = outstanding risk ÷ total applicable risk × 100. <b>Base health</b> = 100 − risk percentage.</li>
        <li>Then <b>deductions</b> are subtracted for the serious problems listed below. One record can cause at most one deduction, and each kind has a cap.</li>
        <li>The result is kept between 0 and 100.</li></ol></div></section>
    <section class="panel"><h4>This project’s numbers</h4><table class="simple">
      ${row('Total applicable risk', h.totalRisk)}${row('Outstanding risk', h.outstandingRisk)}${row('Risk percentage', h.riskPct==null?'—':h.riskPct+'%')}${row('Base health', h.base==null?'—':h.base)}${row('Deductions', '− '+h.deductionTotal)}${row('<b>Final score</b>', '<b>'+(h.score==null?'—':h.score)+'</b>')}</table></section>
    <section class="panel"><h4>Additional deductions</h4>${h.deductions.length?`<table class="simple"><tr><th>Reason</th><th>Records</th><th>Points</th></tr>${h.deductions.map(x=>`<tr><td>${esc(({critical_overdue:'Critical obligation overdue',expired_document:'Required document expired',missing_documents:'Required document missing near a deadline',blocked_statutory:'Critical/high obligation blocked'})[x.kind]||x.kind)}<div class="fact-sub">${x.items.slice(0,4).map(i=>esc(i.cid)+': '+esc(i.reason)).join('<br>')}</div></td><td class="mono">${x.count}</td><td class="mono">${x.points}${x.capped?' (capped at '+x.cap+')':''}</td></tr>`).join('')}</table>`:'<div class="muted" style="font-size:13px;">No additional deductions apply.</div>'}</section>
    <details class="fold"><summary><span>Weights, factors and bands used</span></summary><div class="fold-body"><table class="simple"><tr><th>Status</th><th>Outstanding factor</th></tr>${Object.entries(u.factors).map(([k,v])=>`<tr><td>${esc(k.replace(/_/g,' '))}</td><td class="mono">${v}</td></tr>`).join('')}</table>
      <table class="simple" style="margin-top:10px;"><tr><th>Band</th><th>From score</th></tr><tr><td>Healthy</td><td class="mono">${u.bands.healthy}</td></tr><tr><td>Good</td><td class="mono">${u.bands.good}</td></tr><tr><td>Attention Required</td><td class="mono">${u.bands.attention}</td></tr><tr><td>At Risk</td><td class="mono">${u.bands.at_risk}</td></tr><tr><td>Critical Risk</td><td class="mono">below ${u.bands.at_risk}</td></tr></table>
      ${can('manage_settings')?'<div style="margin-top:10px;"><a href="#" data-goto="settings">Change these in Settings</a></div>':''}</div></details>
    <details class="fold"><summary><span>Records included (${incl.length})</span></summary><div class="fold-body" style="max-height:340px;overflow:auto;"><table class="simple"><tr><th>Record</th><th>Risk level</th><th>Weight</th><th>Status</th><th>Factor</th><th>Outstanding</th></tr>
      ${incl.map(r=>`<tr class="clickable" data-open="${esc(r.key)}"><td class="mono">${esc(r.cid)}${r.scope?' · '+esc(r.scope):''}<div class="fact-sub">${esc(r.title)}</div></td><td>${r.classified?esc(LEVEL_TXT[r.level]):'<span class="muted">Pending validation</span>'}</td><td class="mono">${r.weight}</td><td>${esc(r.status)}</td><td class="mono">${r.factor}</td><td class="mono">${r.outstanding}</td></tr>`).join('')}</table></div></details>
    <details class="fold"><summary><span>Records left out (${h.excluded.length})</span></summary><div class="fold-body" style="max-height:300px;overflow:auto;"><table class="simple"><tr><th>Record</th><th>Why it is excluded</th></tr>${h.excluded.map(r=>`<tr><td class="mono">${esc(r.cid)}${r.scope?' · '+esc(r.scope):''}</td><td>${esc(r.reason)}<div class="fact-sub">${esc(r.detail)}</div></td></tr>`).join('')||'<tr><td colspan="2" class="muted">None</td></tr>'}</table></div></details>
    <section class="panel"><h4>What this score does not know</h4><ul style="margin:0 0 0 18px;font-size:13px;line-height:1.6;">${h.limitations.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>
  </div>`);
  const d2 = document.getElementById('drawer'); d2.querySelectorAll('[data-open]').forEach(a=>a.addEventListener('click', ()=>openDrawer(a.getAttribute('data-open'))));
  d2.querySelectorAll('[data-goto]').forEach(a=>a.addEventListener('click', e=>{ e.preventDefault(); closeDrawer(); switchView(a.dataset.goto); }));
}
