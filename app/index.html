        <div class="field"><label>Do it by</label><input id="raDue" type="date" value="${esc(rec.assigned_due||rec.due_date||'')}"></div></div>
        ${mode!=='assign'&&rec.compliance_key?'<div class="fact-sub">Accepting attaches this action to the compliance record. The record’s status is not changed.</div>':''}</section></div>

async function recAct(id, body){
  try{
    const r = await api('PATCH', '/api/ai-recommendations/'+encodeURIComponent(id), body);
    toast(({accept:'Accepted and attached to the record.', assign:'Assigned.', reject:'Dismissed.', snooze:'Snoozed.', complete:'Marked completed. If the issue is still detected it will reopen.', request_review:'Review requested.', reopen:'Reopened.'})[body.action]||'Saved.');
    await loadIntel(true);
  }catch(e){ toast(e.message, 6000); }
}

/* ---------- report ---------- */

  ${h.deductions.length?tbl(['Deduction','Records','Points'],h.deductions.map(x=>[esc(x.kind.replace(/_/g,' ')),x.count,x.points+(x.capped?' (capped)':'')])):'<p>No additional deductions.</p>'}

  <h2>9. Upcoming deadlines</h2><p>${[['d1','1 day'],['d3','3 days'],['d7','7 days'],['d15','15 days'],['d30','30 days']].map(([k,l])=>h.buckets[k]+' due within '+l).join(' · ')}</p>

/* ---------- wiring (called from attachViewHandlers) ---------- */

  document.querySelectorAll('[data-trendday]').forEach(el=>el.addEventListener('click', ()=>{ I.days = +el.dataset.trendday; I.from = I.to = ''; loadIntel(true); }));
  const ap = document.getElementById('trApply'); if(ap) ap.onclick = ()=>{ I.from = document.getElementById('trFrom').value; I.to = document.getElementById('trTo').value; if(!I.from&&!I.to){ toast('Choose a start or end date.'); return; } loadIntel(true); };
  const rb = document.getElementById('reportBtn'); if(rb) rb.onclick = openReport;
  const rt = document.getElementById('intelRetry'); if(rt) rt.onclick = ()=>loadIntel(false);
  document.querySelectorAll('details[data-fold]').forEach(d=>d.addEventListener('toggle', ()=>{ const k = d.dataset.fold; if(d.open){ S.ui.open.add(k); S.ui.open.delete(k+':closed'); } else { S.ui.open.delete(k); S.ui.open.add(k+':closed'); } }));
  document.querySelectorAll('[data-recact]').forEach(el=>el.addEventListener('click', async ()=>{

/* ---------- administrators: monitoring runs ---------- */
async function startMonitoringRun(body, sourceId){
  if(RU.running){ toast('A check is already running.'); return; }
  try{
    const r = await api('POST', sourceId ? `/api/regulatory/sources/${encodeURIComponent(sourceId)}/run` : '/api/regulatory/run', body||{});
    if(r.skipped){ toast(r.reason||'A check is already running.', 5000); return; }
    RU.running = true; toast('Checking official sources in the background… this can take a few minutes.', 6000);
    const since = new Date(Date.now()-5000).toISOString();
    const poll = async ()=>{
      try{
        const runs = await api('GET','/api/regulatory/runs'); RU.runs = runs;
        const mine = runs.find(x=>x.started_at>=since && x.finished_at);
        if(!mine){ setTimeout(poll, 5000); return; }
        RU.running = false; const t = mine.totals||{};
        toast(`Check finished: ${t.new||0} new, ${t.modified||0} changed, ${t.duplicates||0} duplicate, ${t.failed||0} source problem(s).`, 8000);
        RU.sources = null; RU.rows = null; loadRegSources(); if(S.view==='regulatory') loadRegulatory(); loadNotes();
      }catch(e){ RU.running = false; toast(e.message); }
    };
    setTimeout(poll, 4000);
  }catch(e){ toast(e.message, 6000); }
}

    onSubmit: async v=>{
      const body = {name:v.name, authority:v.authority, kind:v.kind, url:v.url, category:v.category, include:v.include, exclude:v.exclude, note:v.note, robots_confirmed:v.robots_confirmed, enabled:v.enabled};
      if(edit) await api('PUT','/api/regulatory/sources/'+encodeURIComponent(s._id), body); else await api('POST','/api/regulatory/sources', body);
      toast(edit?'Source saved.':'Source added.'); closeDrawer(); RU.sources = null; loadRegSources();
    } });
}

/* ============================= NOTIFICATIONS ============================= */
const ago = iso=>{
  const m = Math.round((Date.now()-new Date(iso))/60000);
  return m<1?'just now' : m<60?m+' min ago' : m<1440?Math.round(m/60)+' h ago' : Math.round(m/1440)+' days ago';
};
async function loadNotes(){
  try{ S.notes = (await api('GET', '/api/notifications')).map(r=>({id:r.id, ...r.data})); }catch(e){ return; }
  updateBell();
  if(!document.getElementById('notePanel').hidden) renderNotePanel();
}
function updateBell(){
  const n = S.notes.filter(x=>!x.read).length, dot = document.getElementById('bellDot');
  dot.hidden = n===0; dot.textContent = n>99 ? '99+' : n;
}
function regNoteBody(n){
  const live = RU.rows && RU.rows.find(r=>r.id===n.reg_id), stage = live ? live.stage : n.review_stage, rev = can('review_regulatory');
  const bits = [n.authority?esc(n.authority):'', n.publication_date?esc(fmtDate(n.publication_date)):'', n.priority?`<span class="chip ${PRI_CLS[n.priority]||''}">${esc(n.priority)}</span>`:'', stage?`<span class="chip">${esc(STAGE_TXT[stage]||stage)}</span>`:''].filter(Boolean).join(' · ');
  const co = (n.company_ids||[]).map(c=>(S.companies[c]||{}).name).filter(Boolean)[0], pr = (n.project_ids||[]).map(p=>(S.projects[p]||{}).name).filter(Boolean);
  return `<div class="m">${esc(n.message)}</div><div class="m ru-note-meta">${bits}</div>
    ${(co||pr.length)?`<div class="m">${co?esc(co)+' · ':''}${pr.length?esc(pr.slice(0,2).join(', '))+(pr.length>2?` +${pr.length-2} more`:''):''}</div>`:''}
    ${n.applicability?`<div class="m">${esc(n.applicability)}</div>`:''}
    <div class="ru-nacts"><button class="btn sm" data-nact="open" type="button">Open update</button>${rev&&n.type==='regulatory_update'?'<button class="btn sm" data-nact="review" type="button">Review applicability</button><button class="btn sm" data-nact="assign" type="button">Assign</button><button class="btn sm" data-nact="task" type="button">Create task</button>':''}${n.source_url&&/^https?:\/\//i.test(n.source_url)?`<a class="btn sm" href="${esc(n.source_url)}" target="_blank" rel="noopener noreferrer">Official source ↗</a>`:''}${n.read?'':'<button class="btn sm" data-nact="read" type="button">Mark read</button>'}<button class="btn sm" data-nact="dismiss" type="button">Dismiss</button></div>`;
}
function renderNotePanel(){
  const p = document.getElementById('notePanel');
  const unread = S.notes.filter(x=>!x.read).length;
  p.innerHTML = `<div class="note-head"><b>Notifications</b><span>${unread?`<button class="btn sm" id="noteAll" type="button">Mark all read</button>`:''}</span></div>
    ${S.notes.length ? S.notes.map(n=>`<div class="note ${n.read?'':'unread'}" data-note="${esc(n.id)}" data-nkey="${esc(n.key||'')}" ${n.reg_id?`data-nreg="${esc(n.reg_id)}"`:''}><span class="lvl ${esc(n.level||'info')}"></span><div style="min-width:0"><div class="t">${esc(n.title)}</div>${n.reg_id?regNoteBody(n):`<div class="m">${esc(n.message)}</div>`}<div class="w">${ago(n.at)}</div></div></div>`).join('')
      : '<div class="empty-state" style="padding:30px 16px;">Nothing yet. Reminders, document approvals and unblocked records show up here.</div>'}`;
  p.querySelectorAll('[data-note]').forEach(el=>el.onclick = async e=>{
    const id = el.dataset.note, key = el.dataset.nkey, reg = el.dataset.nreg;
    const btn = e.target.closest('[data-nact]');
    if(e.target.closest('a')) return;
    if(btn){
      e.stopPropagation();
      const act = btn.dataset.nact;
      if(act==='read'){ try{ await api('POST','/api/notifications/read',{ids:[id]}); }catch(er){} const n = S.notes.find(x=>x.id===id); if(n) n.read = true; updateBell(); renderNotePanel(); return; }
      if(act==='dismiss'){ try{ await api('POST','/api/notifications/dismiss',{ids:[id]}); }catch(er){ toast(er.message); return; } S.notes = S.notes.filter(x=>x.id!==id); updateBell(); renderNotePanel(); return; }
      document.getElementById('notePanel').hidden = true;
      try{ await api('POST','/api/notifications/read',{ids:[id]}); }catch(er){} const n0 = S.notes.find(x=>x.id===id); if(n0) n0.read = true; updateBell();
      if(!RU.opts){ try{ RU.opts = await api('GET','/api/regulatory/options'); }catch(er){} }
      const u = await openRegulatory(reg, act==='review'?'#ruImpacts':null);
      if(u && act==='assign') ruAssignForm(u);
      if(u && act==='task') ruTaskForm(u);
      return;
    }
    try{ await api('POST', '/api/notifications/read', {ids:[id]}); }catch(er){}
    const n = S.notes.find(x=>x.id===id); if(n) n.read = true; updateBell();
    document.getElementById('notePanel').hidden = true;
    if(reg){ if(!RU.opts){ try{ RU.opts = await api('GET','/api/regulatory/options'); }catch(er){} } openRegulatory(reg); return; }
    if(key) openDrawer(key);
  });
  const all = p.querySelector('#noteAll');
  if(all) all.onclick = async ()=>{ try{ await api('POST', '/api/notifications/read', {all:true}); S.notes.forEach(n=>n.read=true); updateBell(); renderNotePanel(); }catch(e){ toast(e.message); } };
}
document.getElementById('bellBtn').addEventListener('click', e=>{
  e.stopPropagation();
  const p = document.getElementById('notePanel');
  p.hidden = !p.hidden;
  document.getElementById('bellBtn').setAttribute('aria-expanded', !p.hidden);
  if(!p.hidden){ renderNotePanel(); loadNotes(); }
});
document.addEventListener('click', e=>{ const p = document.getElementById('notePanel'); if(!p.hidden && !p.contains(e.target)) p.hidden = true; });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.getElementById('notePanel').hidden = true; });

/* ============================= BOOT ============================= */
document.getElementById('overlay').addEventListener('click', closeDrawer);
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>switchView(t.dataset.view)));
document.getElementById('projectSelect').addEventListener('change', e=>{ S.dashPortfolio = false; setCtx(e.target.value); render(); });
document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  try{ await fetch('/auth/logout', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'}); }catch(e){}
  location.href = '/login.html';
});

(async function boot(){
  try{ ME = await api('GET', '/auth/me'); }catch(e){ return; } // 401 already redirected to the login page
  S.role = ME.role;
  document.getElementById('userChip').textContent = ME.name+' · '+(ME.role_label||ME.role);
  document.getElementById('sideName').textContent = ME.name;
  document.getElementById('sideRole').textContent = ME.role_label||ME.role;
  document.getElementById('sideAvatar').textContent = (ME.name||'?').trim().charAt(0).toUpperCase();
  document.getElementById('sideUser').hidden = false;
  document.getElementById('usersTab').hidden = !can('manage_users');
  try{ const r = await api('GET', '/auth/roles'); S.roles = r.roles; S.capLabels = r.caps; }catch(e){}
  await loadData();
  populateProjectSelect();
  switchView('dashboard');
  await initCapabilities();
  render();
  loadNotes(); setInterval(loadNotes, 60000);
  loadRegulatory(); setInterval(()=>{ if(S.view!=='regulatory') loadRegulatory(); }, 120000);
})();
</script>
